name: Build Windows Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 专用：48 万行干净全量编译（0 错误时编译器不早停、吃内存更大）需要大堆；本地 2 GiB 只编 compat 不动。——Nova 注
      - name: Bump heap for CI full compile
        shell: bash
        run: sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m/' gradle.properties

      # 纯编译普查（先跑，compile-log 在此生成）——Nova 注
      - name: Compile census
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinDesktop --no-daemon --stacktrace 2>&1 | tee composeApp-compile.log

      # 编译日志走 artifact 存储（绕开 GitHub Actions 日志 blob 的 BlobNotFound 故障）。——Nova 注
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: composeApp-compile.log
          if-no-files-found: warn

      # 打包单独一步（若卡住不挡上面的编译普查）。——Nova 注
      - name: Build Windows MSI/EXE
        shell: bash
        run: |
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit-windows-installer
          path: |
            composeApp/build/compose/binaries/main*/msi/*.msi
            composeApp/build/compose/binaries/main*/exe/*.exe
          if-no-files-found: warn

  # Linux 无头冒烟测试：验证接上真实 UI 后 app 能真正启动（初始化链不崩）。——Nova 注
  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump heap for full compile
        shell: bash
        run: sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m/' gradle.properties

      - name: Install Xvfb + 图形依赖 + 截图工具
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxrender1 libxtst6 libxi6 libxext6 libx11-6 libfontconfig1 libgl1 imagemagick x11-apps > /dev/null

      # 先编译出可分发的 app（这步不限制时间，编译要 ~7min）——Nova 注
      - name: Build distributable (compile)
        shell: bash
        run: ./gradlew :composeApp:createDistributable --no-daemon --stacktrace

      # 无头跑 app 并截图：Xvfb 虚拟显示跑起来，等渲染后抓屏，看真实 UI 是否渲出。——Nova 注
      - name: Run app headless + capture screenshot
        shell: bash
        run: |
          set -o pipefail
          BIN=$(ls composeApp/build/compose/binaries/main/app/*/bin/* 2>/dev/null | grep -v '\.bat$' | head -1)
          echo "运行二进制: $BIN"
          chmod +x "$BIN" 2>/dev/null || true
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          sleep 2
          "$BIN" > smoke.log 2>&1 &
          APP_PID=$!
          sleep 30
          # 抓屏（ImageMagick import 优先，退到 xwd）——Nova 注
          (import -window root smoke.png 2>/dev/null && echo "截图成功(import)") || (xwd -root -display :99 -silent 2>/dev/null | convert xwd:- smoke.png 2>/dev/null && echo "截图成功(xwd)") || echo "截图失败"
          kill $APP_PID 2>/dev/null || true
          echo "═══ app 启动日志 ═══"
          cat smoke.log

      - name: Upload smoke log + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            smoke.log
            smoke.png
          if-no-files-found: warn
