name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI/EXE
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit-windows-installer
          path: |
            composeApp/build/compose/binaries/main*/msi/*.msi
            composeApp/build/compose/binaries/main*/exe/*.exe
          if-no-files-found: warn
