name: Build Windows Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI/EXE
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --no-daemon --stacktrace 2>&1 | tee composeApp-compile.log

      # 编译日志走 artifact 存储（绕开 GitHub Actions 日志 blob 的 BlobNotFound 故障）。——Nova 注
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: composeApp-compile.log
          if-no-files-found: warn

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit-windows-installer
          path: |
            composeApp/build/compose/binaries/main*/msi/*.msi
            composeApp/build/compose/binaries/main*/exe/*.exe
          if-no-files-found: warn
