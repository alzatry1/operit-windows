default_assistant_guide_intro=Depois de definir o Operit como o assistente padrão do sistema, você pode iniciar rapidamente o assistente de voz Operit pressionando longamente o botão Home ou usando a ativação por voz para uma experiência de interação de IA mais conveniente.
default_assistant_guide_open_gesture_settings=Abrir configurações de gestos
default_assistant_guide_open_settings=Abra as configurações do assistente
default_assistant_guide_step1_desc=Defina o Operit como o aplicativo de assistente digital padrão do seu sistema
default_assistant_guide_step1_detail1=• Abra Configurações do sistema → Aplicativos → Aplicativos padrão → Aplicativo Assistente Digital
default_assistant_guide_step1_detail2=• Encontre e selecione "Operit AI" na lista de aplicativos assistentes
default_assistant_guide_step1_detail_android12=Android 12+: Configurações → Aplicativos → Aplicativos padrão → Aplicativo Digital Assistant → Aplicativo Digital Assistant padrão
default_assistant_guide_step1_title=Definir como assistente padrão
default_assistant_guide_step2_desc=Defina como ativar rapidamente o Operit Assistant
default_assistant_guide_step2_detail1=• Pressionar longamente o botão Início: o método mais comum, disponível na maioria dos dispositivos
default_assistant_guide_step2_detail2=• Deslize de baixo para cima na tela: alguns dispositivos suportam gestos em tela cheia
default_assistant_guide_step2_detail3=• Ativação por voz: "Ok Google" ou a palavra de ativação especificada pelo dispositivo (requer suporte do dispositivo)
default_assistant_guide_step2_detail_android12=Android 12+: Configurações → Aplicativos → Aplicativos padrão → Aplicativo Digital Assistant → Aplicativo Digital Assistant padrão
default_assistant_guide_step2_note=Nota: As configurações de gestos podem variar entre diferentes marcas de celulares, verifique as opções disponíveis nas configurações do sistema
default_assistant_guide_step2_title=Configurar gestos de inicialização
default_assistant_guide_step3_desc=Depois de concluir a configuração, teste se o Operit pode ser despertado normalmente
default_assistant_guide_step3_detail1=• Use um gesto que você definir (como um toque longo no botão Início) para invocar o Assistente
default_assistant_guide_step3_detail2=• Se for bem-sucedido, você deverá ver a interface do assistente de voz do Operit
default_assistant_guide_step3_detail3=• Você pode tentar falar ou digitar para interagir com o assistente
default_assistant_guide_step3_title=Funcionalidade do assistente de teste
default_assistant_guide_step4_desc=Depois que a configuração for concluída, teste se ele pode iniciar normalmente
default_assistant_guide_step4_detail1=• Um toque longo no botão Home deve abrir o assistente de voz Operit
default_assistant_guide_step4_detail2=• Se o dispositivo suportar ativação por voz, dizer "Ok Google" ou a palavra de ativação especificada pelo dispositivo também poderá acionar o Operit
default_assistant_guide_step4_title=Teste seu assistente de voz
default_assistant_guide_steps_title=Etapas de configuração
default_assistant_guide_subtitle=Deixe Operit ser seu assistente inteligente
default_assistant_guide_title=Defina seu assistente de voz padrão
default_assistant_guide_troubleshooting_content=Se você não encontrar o Operit na lista, verifique se:\n\n• O aplicativo está instalado corretamente e não foi desativado\n• As permissões necessárias (microfone, janela flutuante etc.) foram concedidas\n• Tente reiniciar o dispositivo e configurá-lo novamente\n\n Alguns sistemas de personalização podem restringir aplicativos de terceiros como assistente padrão. Nesse caso, você ainda pode usar o Operit por meio da função de janela flutuante dentro do aplicativo.
default_assistant_guide_troubleshooting_title=Está com algum problema?
