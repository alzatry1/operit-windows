waifu_mode_explanation=• Modo normal: as respostas de IA são enviadas todas de uma vez\n• Modo Waifu: as respostas de IA são divididas por frases, cada frase tem um balão independente\n• Atraso inteligente: calcula o tempo de atraso com base no comprimento da frase\n• Limpeza automática: remove rótulos de status, exibe apenas texto simples\n• Funções opcionais: remover pontuação no final das frases, editar o prompt do modo Waifu, ativar emoticons\n• Cenários aplicáveis: simular um ritmo de conversa mais natural\n• Observação: este modo pode não ser bem adaptado à ferramenta chamadas
