token_info_content=Você irá para o site oficial da API DeepSeek. Temos acesso integrado ao site oficial do DeepSeek porque acreditamos que é a API com melhor custo-benefício na China. Ele não só tem um desempenho poderoso, mas também vários descontos e cache de disco para reduzir os custos de uso. \n\nO acesso à API e as configurações de token não têm nada a ver com desenvolvedores de software. Não forneceremos nenhum serviço nesse sentido, nem receberemos quaisquer taxas. \n\nRecomenda-se cobrar apenas 1 yuan ao usar seu próprio token pela primeira vez, o que é suficiente.
