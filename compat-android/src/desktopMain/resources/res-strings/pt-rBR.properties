permission_guide_intro_1_desc=Converse naturalmente com a IA por meio de reconhecimento e síntese de fala nativos que são executados inteiramente no seu dispositivo. Sua voz é o comando e você pode comandá-la para realizar operações complexas, como cliques na tela e saltos de aplicativos, liberando completamente suas mãos.
permission_guide_intro_1_title=Automação de UI orientada por voz
permission_guide_intro_2_desc=Mais de 40 ferramentas profissionais integradas, abrangendo gerenciamento de arquivos, solicitações de rede, execução de scripts e controle de sistema. Combinado com um poderoso sistema de plug-ins, você pode automatizar tarefas e obter controle profundo sobre seu dispositivo.
