import_structure_guide_content=Esta é a estrutura de diretórios do “pacote de importação” (dentro do ZIP ou arquivo selecionado), não o armazenamento interno do aplicativo. \n\nDragonBones (.zip)\n my_dragonbones.zip\n any_folder_name/\n hero_ske.json\n hero_tex.json\n hero_tex.png\n Requisito: o prefixo do nome do arquivo ske/tex json/png é consistente. \n\nWebP (.zip)\n my_webp.zip\n any_folder_name/\n idle.webp\n talk.webp\n happy.webp\n Requisito: Contém pelo menos um arquivo .webp. \n\nMP4\n Caminho A (arquivo direto):\n avatar.mp4\n Caminho B (.zip):\n my_mp4.zip\n any_folder_name/\n idle.mp4\n talk.mp4\n happy.mp4\n Requisito: Contém pelo menos um arquivo .mp4. \n\nMMD (.zip)\n my_mmd.zip\n any_folder_name/\n character.pmx (ou .pmd)\n motions/idle.vmd (opcional)\n texturas/...\n Requisito: Mantenha os caminhos relativos das referências PMX/PMD inalterados. \n\nglTF\n Caminho A (arquivo direto):\n avatar.glb\n Caminho B (glTF de vários arquivos usando .zip):\n my_gltf.zip\n any_folder_name/\n avatar.gltf\n avatar.bin\n texturas/...\n Requisito: Mantenha o caminho relativo da referência .gltf inalterado. \n\nFBX\n Método A (arquivo direto, somente recursos independentes):\n avatar.fbx\n Método B (texturas/recursos externos, use .zip):\n my_fbx.zip\n any_folder_name/\n avatar.fbx\n texturas/...\n Requisito: Carregar diretamente .fbx Somente recursos incorporados são suportados; se o modelo fizer referência a texturas externas ou outros recursos, mantenha o caminho relativo e coloque-o em ZIP.
