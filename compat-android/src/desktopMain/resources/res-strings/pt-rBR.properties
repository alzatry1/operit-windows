function_desc_audio_recognition=Usado para reconhecimento e análise de conteúdo de áudio. Ao chamar a ferramenta read_file para ler áudio, você pode usar o parâmetro intent para compreensão aprofundada (como transliteração/resumo/identificação de conteúdo falado). Recomenda-se usar um modelo que suporte entrada de áudio ou transcrição de alta qualidade.
function_desc_chat=Função de diálogo principal, usada para interação diária de diálogo com os usuários
function_desc_file_binding=Lide com vinculação e mistura inteligentes de conteúdo de arquivo para fornecer recursos de processamento de código mais precisos. Recomenda-se usar modelos rápidos e baratos como Gemini Flash, DeepSeek R1 não é recomendado
function_desc_grep=Planejamento de pesquisa e filtragem de resultados para grep_context (várias rodadas de grep_code)
function_desc_image_recognition=Usado para reconhecimento e análise de conteúdo de imagem. Ao chamar a ferramenta read_file para ler imagens, ela suporta parâmetros de intenção para uma compreensão aprofundada. Recomenda-se a utilização de modelos multimodais que apoiem a visão.
function_desc_memory=Processar memórias e armazená-las na biblioteca de memória
function_desc_role_response_planner=Usado para determinar dinamicamente a ordem de fala e a estratégia de pular desta rodada no grupo, apoiando múltiplas rodadas de discussões
function_desc_summary=Compactar o contexto e gerar resumos de chat
function_desc_title_generation=Gera um título de conversa curto e preciso a partir da primeira mensagem do usuário.
function_desc_translation=Fornece função de tradução multilíngue e suporta conversão de idioma de conteúdo de texto. Recomenda-se usar um modelo que suporte vários idiomas.
function_desc_ui_controller=Usado para passagem e operação automática da interface UI. O modelo de controlador de UI correspondente só será habilitado quando o usuário solicitar explicitamente o uso do controle "inteligente". Por exemplo, modelos especiais como o autoglm podem ser selecionados.
function_desc_video_recognition=Usado para reconhecimento e análise de conteúdo de vídeo. Ao chamar a ferramenta read_file para ler o vídeo, você pode usar o parâmetro intent para uma compreensão aprofundada (como extração de quadro/descrição da cena/resumo do diálogo). Recomenda-se usar modelos multimodais que suportem entrada de vídeo/imagem.
