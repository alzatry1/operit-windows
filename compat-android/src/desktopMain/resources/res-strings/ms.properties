default_assistant_guide_intro=Selepas menetapkan Operit sebagai pembantu lalai sistem, anda boleh melancarkan pembantu suara Operit dengan cepat melalui menekan lama kekunci Home atau menggunakan bangunkan suara, untuk mendapatkan pengalaman interaksi AI yang lebih mudah.
default_assistant_guide_open_gesture_settings=Buka Tetapan Isyarat
default_assistant_guide_open_settings=Buka Tetapan Pembantu
default_assistant_guide_step1_desc=Tetapkan Operit sebagai aplikasi pembantu digital lalai sistem
default_assistant_guide_step1_detail1=• Buka Tetapan Sistem → Aplikasi → Aplikasi Lalai → Aplikasi Pembantu Digital
default_assistant_guide_step1_detail2=• Cari dan pilih "Operit AI" dalam senarai aplikasi pembantu
default_assistant_guide_step1_detail_android12=Android 12+: Tetapan → Aplikasi → Aplikasi Lalai → Aplikasi Pembantu Digital → Aplikasi Pembantu Digital Lalai
default_assistant_guide_step1_title=Tetapkan sebagai Pembantu Lalai
default_assistant_guide_step2_desc=Tetapkan cara untuk membangkitkan pembantu Operit dengan cepat
default_assistant_guide_step2_detail1=• Tekan lama kekunci Home: Kaedah paling biasa digunakan, tersedia pada kebanyakan peranti
default_assistant_guide_step2_detail2=• Geser ke atas dari bahagian bawah skrin: Sesetengah peranti yang menyokong isyarat skrin penuh
default_assistant_guide_step2_detail3=• Bangunkan suara: "Hey Google" atau kata bangunkan yang ditetapkan peranti (memerlukan sokongan peranti)
default_assistant_guide_step2_detail_android12=Android 12+: Tetapan → Aplikasi → Aplikasi Lalai → Aplikasi Pembantu Digital → Aplikasi Pembantu Digital Lalai
default_assistant_guide_step2_note=Perhatian: Tetapan isyarat mungkin berbeza mengikut jenama telefon, sila semak pilihan yang tersedia dalam tetapan sistem
default_assistant_guide_step2_title=Konfigurasi Isyarat Pelancaran
default_assistant_guide_step3_desc=Selepas selesai penetapan, uji sama ada Operit boleh dibangkitkan dengan normal
default_assistant_guide_step3_detail1=• Gunakan isyarat yang anda tetapkan (seperti menekan lama kekunci Utama) untuk membangkitkan pembantu
default_assistant_guide_step3_detail2=• Jika berjaya, anda sepatutnya melihat antara muka pembantu suara Operit
default_assistant_guide_step3_detail3=• Anda boleh cuba bercakap atau menaip teks untuk berinteraksi dengan pembantu
default_assistant_guide_step3_title=Uji Fungsi Pembantu
default_assistant_guide_step4_desc=Selepas selesai penetapan, uji sama ada boleh dilancarkan dengan normal
default_assistant_guide_step4_detail1=• Menekan lama kekunci Home (butang skrin utama) sepatutnya melancarkan pembantu suara Operit
default_assistant_guide_step4_detail2=• Jika peranti menyokong bangunkan suara, menyebut "Hey Google" atau kata bangunkan yang ditetapkan peranti juga mungkin mencetuskan Operit
default_assistant_guide_step4_title=Uji Pembantu Suara
default_assistant_guide_steps_title=Langkah-langkah Penetapan
default_assistant_guide_subtitle=Jadikan Operit sebagai pembantu pintar anda
default_assistant_guide_title=Tetapkan Pembantu Suara Lalai
default_assistant_guide_troubleshooting_content=Jika Operit tidak ditemui dalam senarai, pastikan:\n\n• Aplikasi telah dipasang dengan betul dan tidak dilumpuhkan\n• Keizinan yang diperlukan telah diberikan (mikrofon, tetingkap terapung, dll.)\n• Cuba tetapkan semula selepas menghidupkan semula peranti\n\nSesetengah sistem tersuai mungkin menghadkan aplikasi pihak ketiga sebagai pembantu lalai. Jika berlaku, anda masih boleh menggunakan Operit melalui fungsi tetingkap terapung dalam aplikasi.
default_assistant_guide_troubleshooting_title=Menghadapi masalah?
