function_config_desc=Sembang, suara, dan desktop pet akan memilih konfigurasi petunjuk yang sepadan secara automatik berdasarkan penggunaan.
function_config_title=Konfigurasi Fungsi
function_desc_audio_recognition=Digunakan untuk pengenalan dan analisis kandungan audio, memanggil alat read_file untuk membaca audio dengan menggunakan parameter intent untuk pemahaman mendalam (seperti transkripsi/ringkasan/pengenalan kandungan pertuturan). Disyorkan menggunakan model yang menyokong input audio atau transkripsi berkualiti tinggi.
function_desc_chat=Fungsi perbualan utama, digunakan untuk interaksi perbualan harian dengan pengguna
function_desc_file_binding=Memproses pengikatan dan percampuran pintar kandungan fail, menyediakan keupayaan pemprosesan kod yang lebih tepat. Disyorkan menggunakan model murah pantas seperti Gemini Flash, tidak disyorkan menggunakan DeepSeek R1
function_desc_grep=Digunakan untuk perancangan pencarian grep_context dan penapisan hasil (grep_code berbilang pusingan)
function_desc_image_recognition=Digunakan untuk pengenalan dan analisis kandungan imej, memanggil alat read_file untuk membaca gambar dengan menyokong parameter intent untuk pemahaman mendalam. Disyorkan menggunakan model multimodal yang menyokong penglihatan.
function_desc_memory=Memproses ingatan dan menyimpannya ke dalam bank ingatan
function_desc_role_response_planner=Digunakan untuk menentukan urutan bercakap dan strategi langkauan secara dinamik dalam kumpulan, menyokong perbincangan berbilang pusingan
function_desc_summary=Mampatkan konteks, hasilkan ringkasan sembang
function_desc_title_generation=Menjana tajuk perbualan yang ringkas dan tepat daripada mesej pertama pengguna.
function_desc_translation=Menyediakan fungsi terjemahan pelbagai bahasa, menyokong penukaran bahasa kandungan teks. Disyorkan menggunakan model yang menyokong pelbagai bahasa.
function_desc_ui_controller=Digunakan untuk penerokaan dan pengendalian automatik antara muka UI, model pengawal UI yang sepadan hanya akan diaktifkan apabila pengguna secara eksplisit meminta penggunaan kawalan "agen", contohnya boleh memilih model khusus seperti autoglm.
function_desc_video_recognition=Digunakan untuk pengenalan dan analisis kandungan video, memanggil alat read_file untuk membaca video dengan menggunakan parameter intent untuk pemahaman mendalam (seperti pemahaman ekstrak binggan/penerangan adegan/ringkasan dialog). Disyorkan menggunakan model multimodal yang menyokong input video/imej.
