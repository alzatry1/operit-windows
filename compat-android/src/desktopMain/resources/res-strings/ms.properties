import_structure_guide_content=Ini adalah struktur direktori untuk "pakej import" (ZIP atau dalam fail yang dipilih), bukan storan dalaman aplikasi.\n\nDragonBones (.zip)\n  my_dragonbones.zip\n    any_folder_name/\n      hero_ske.json\n      hero_tex.json\n      hero_tex.png\n  Keperluan: Awalan nama fail ske/tex json/png mesti sama.\n\nWebP (.zip)\n  my_webp.zip\n    any_folder_name/\n      idle.webp\n      talking.webp\n      happy.webp\n  Keperluan: Mesti mengandungi sekurang-kurangnya satu fail .webp.\n\nMP4\n  Kaedah A (fail terus):\n    avatar.mp4\n  Kaedah B (.zip):\n    my_mp4.zip\n      any_folder_name/\n        idle.mp4\n        talking.mp4\n        happy.mp4\n  Keperluan: Mesti mengandungi sekurang-kurangnya satu fail .mp4.\n\nMMD (.zip)\n  my_mmd.zip\n    any_folder_name/\n      character.pmx (atau .pmd)\n      motions/idle.vmd (pilihan)\n      textures/...\n  Keperluan: Kekalkan laluan relatif yang dirujuk oleh PMX/PMD.\n\nglTF\n  Kaedah A (fail terus):\n    avatar.glb\n  Kaedah B (glTF berbilang fail guna .zip):\n    my_gltf.zip\n      any_folder_name/\n        avatar.gltf\n        avatar.bin\n        textures/...\n  Keperluan: Kekalkan laluan relatif yang dirujuk oleh .gltf.\n\nFBX\n  Kaedah A (fail terus, hanya sumber terbenam):\n    avatar.fbx\n  Kaedah B (guna .zip untuk tekstur/sumber luaran):\n    my_fbx.zip\n      any_folder_name/\n        avatar.fbx\n        textures/...\n  Keperluan: Muat naik langsung .fbx hanya menyokong sumber terbenam; jika model merujuk tekstur luaran atau sumber lain, kekalkan laluan relatif dan masukkan ke dalam ZIP.
