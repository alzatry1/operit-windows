enable_direct_audio_processing=Model menyokong pemprosesan audio langsung
enable_direct_audio_processing_desc=Setelah diaktifkan, audio akan dihantar terus kepada AI untuk diproses, bukan melalui alat yang mengembalikan transkripsi/deskripsi teks
enable_direct_image_processing=Model menyokong pemprosesan imej langsung
