market_agreement_content=1. Kedudukan pasaran. Pasaran plugin Operit hanya digunakan untuk berkongsi, menemui, dan mengindeks skrip, kit alat, Skill, MCP, dan sambungan lain, serta menyediakan pintu masuk untuk melayari, memuat turun, dan memasang dalam pasaran. Pasaran bukan pengarang plugin, pembeli, penjual, broker, pihak pembayaran, penjamin, atau institusi pendaftaran hak; paparan, penyertaan, penyusunan, atau pengesyoran plugin oleh pasaran tidak bermakna plugin itu dibangunkan, dimiliki, diwakili, atau disokong oleh Operit.\n\n2. Kebenaran penerbitan. Apabila penerbit menghantar plugin ke pasaran, mereka memberikan Operit lesen bukan eksklusif, tidak boleh dipindah milik, yang diperlukan semata-mata untuk mengendalikan pasaran, untuk menyimpan, cache, menyalin, memproses, memaparkan, mengindeks entri pasaran, dan menyediakan muat turun dan pemasangan plugin kepada pengguna pasaran. Tindakan penerbitan juga bermakna penerbit membenarkan pengguna pasaran memuat turun, memasang, dan menggunakan plugin secara normal dalam skop tujuan reka bentuk, tetapi tidak semestinya membenarkan pengubahsuaian atau pengedaran semula. Lesen ini tidak memindahkan hak cipta, pemilikan, atau hak lain plugin; pasaran tidak boleh memperoleh hak sublesen bebas di luar pasaran berdasarkan ini. Penerbit harus memastikan mereka berhak memberikan kebenaran di atas.\n\n3. Cadangan sumber terbuka GitHub. Kami mengesyorkan penerbit menerbitkan kod sumber, README, lesen, versi atau Release, dan rekod perubahan secara langsung dalam repositori GitHub awam yang mereka kawal, dan mendaftarkan sumber dari repositori tersebut ke pasaran. Repositori GitHub yang boleh dilihat secara awam tidak bermakna lesen sumber terbuka diberikan secara automatik; sama ada penggunaan, pengubahsuaian, dan pengedaran semula dibenarkan adalah berdasarkan lesen sumber terbuka yang dinyatakan secara jelas oleh pengarang atau kebenaran bertulis lain.\n\n4. Penggunaan dan pengedaran semula oleh pengguna. Hak pengedaran semula plugin pada dasarnya dikekalkan oleh pengarang atau pemegang hak lain. Muat turun, pemasangan, dan penggunaan normal yang disebutkan di atas tidak bermakna setiap pengguna diberi hak untuk memuat naik semula, memajukan, mengubah pakej, menjual, atau menerbitkan semula plugin. Kecuali dinyatakan sebaliknya oleh undang-undang, pengguna hanya boleh mengubah suai dan mengedarkan semula mengikut lesen atau kebenaran yang dinyatakan oleh pengarang; plugin yang tidak menyatakan kebenaran pengedaran semula tidak boleh diedarkan semula sendiri. Skop hak plugin sumber terbuka adalah berdasarkan lesen sumber terbukanya.\n\n5. Risiko pihak ketiga dan tanggungjawab keselamatan. Plugin mempunyai kod, konfigurasi, dan kebenaran pelaksanaan bebas; ia mungkin melaksanakan kod, memulakan perkhidmatan tempatan, mengakses fail, membaca pemboleh ubah persekitaran, atau menyambung ke rangkaian. Pengguna harus menyemak sendiri dan menanggung risiko mengaktifkan, memasang, dan menggunakan plugin. Penerbit tidak boleh menyerahkan API Key, Cookie, Token, kunci peribadi, kata laluan akaun, atau data pengguna dalam plugin, repositori, contoh, atau konfigurasi, dan harus menerangkan dengan jujur pengarang, lesen, kebenaran, tingkah laku rangkaian, pemboleh ubah persekitaran, perkhidmatan luaran, dan risiko yang diketahui. Operit tidak menjamin keselamatan, ketepatan, ketersediaan, kesahan, atau keserasian sambungan pihak ketiga.\n\n6. Ulasan dan tingkah laku komuniti. Kandungan ulasan harus berkaitan dengan fungsi plugin, pengalaman penggunaan, kecacatan, atau isu keselamatan. Tidak dibenarkan menerbitkan nombor kumpulan QQ, Telegram, Discord, maklumat hubungan, iklan, maklumat pemindahan trafik, maklumat transaksi, pautan tidak berkaitan, atau kandungan lain yang mungkin mengganggu ketenteraman komuniti; tidak dibenarkan mendedahkan API Key, Cookie, Token, kunci peribadi, kata laluan akaun, atau data peribadi lain.\n\n7. Larangan transaksi dan pemindahan trafik. Tidak dibenarkan membeli, menjual, atau memasang plugin secara tidak sah dalam pasaran; tidak dibenarkan menggunakan pembayaran, tip, keahlian, sembang peribadi, atau pautan pihak ketiga untuk memujuk orang lain membayar untuk plugin percuma. Pasaran tidak menyediakan perkhidmatan pembayaran, pelaksanaan, bayaran balik, atau penyelesaian pertikaian transaksi. Plugin percuma tidak memerlukan pembayaran kepada sesiapa; caj, kebenaran, atau janji dari saluran pihak ketiga tidak mewakili sokongan rasmi Operit.\n\n8. Sempadan perkhidmatan pasaran. Untuk menyediakan perkhidmatan perkongsian, muat turun, dan pemasangan, pasaran mungkin menyimpan, cache, atau menghantar entri pasaran dan fail plugin, tetapi tidak menjanjikan pengehosan kekal, sandaran, kerahsiaan, atau pencegahan penyalinan. Menerbitkan ke pasaran bermakna pengarang memberi kebenaran kepada pasaran untuk menyediakan muat turun dan pemasangan kepada pengguna pasaran mengikut perjanjian ini, tetapi tidak bermakna orang ramai secara automatik mendapat hak pengedaran semula. Ketersediaan, muat turun, dan penggunaan berterusan plugin juga bergantung pada repositori pengarang, GitHub, dan perkhidmatan pihak ketiga lain.\n\n9. Penguatkuasaan peraturan dan kemas kini perjanjian. Ulasan, entri, atau akaun yang melanggar peraturan ini mungkin disekat, disembunyikan, atau dialih keluar. Apabila perjanjian pasaran berubah secara substantif kerana keperluan fungsi, undang-undang, atau keselamatan, versi perjanjian akan dinaikkan; pengguna perlu membaca dan mengesahkan semula apabila memasuki pasaran.
