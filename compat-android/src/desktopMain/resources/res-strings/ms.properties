external_http_chat_intent_overview=HTTP dan Intent mempunyai semantik parameter yang sama, hanya kemasukan yang berbeza.\n\nTindakan Permintaan: %1$s\nTindakan Pemulangan Lalai: %2$s\n\nExtras biasa: message, request_id, group, create_new_chat, chat_id, create_if_none, show_floating, return_tool_status, initial_mode, auto_exit_after_ms, stop_after, reply_action, reply_package\n\nSelepas pemprosesan selesai, ia akan dipulangkan melalui siaran: success, chat_id, ai_response, error; jika anda hanya mahu memulangkan kepada App tertentu, tetapkan reply_package.
