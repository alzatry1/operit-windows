token_info_content=Anda akan dihantar ke laman web rasmi DeepSeek API. Kami menyediakan akses ke laman web rasmi DeepSeek kerana kami percaya ia adalah API yang paling berpatutan untuk digunakan di negara ini, bukan sahaja berprestasi tinggi, tetapi juga menawarkan pelbagai diskaun dan cache cakera untuk mengurangkan kos penggunaan.\n\nAkses API dan penetapan Token tidak berkaitan dengan pembangun perisian, kami tidak menyediakan sebarang perkhidmatan dalam hal ini, dan tidak akan memperoleh sebarang bayaran.\n\nUntuk penggunaan pertama dengan token sendiri, disyorkan untuk hanya menambah nilai RM1, yang sudah cukup untuk digunakan sepenuhnya.
