agreement_human_readable_content=Sempadan perkhidmatan: Operit tidak menyediakan perkhidmatan interaksi emosi antropomorfik kepada orang awam. Operit ialah klien sumber terbuka yang berjalan secara setempat pada peranti pengguna. Operit tidak mengendalikan perkhidmatan inferens model, tidak mengehos sesi sembang atau data interaksi, dan tidak mengedarkan kelayakan model berkongsi. Permintaan model awan dihantar terus daripada peranti anda kepada penyedia model yang anda konfigurasikan dengan kelayakan anda sendiri; data berkaitan tertakluk kepada peraturan penyedia tersebut. Model tempatan menjalankan inferens pada peranti anda.\n\nAplikasi ini boleh memanggil fail, terminal, automasi, Root, ADB, sambungan dan keupayaan serupa. Semak operasi sebelum menjalankannya, sandarkan data penting, dan berikan kebenaran dengan berhati-hati. Kerugian pada peranti, data, akaun atau kepentingan lain yang disebabkan oleh tindakan pengguna, konfigurasi pengguna, perkhidmatan pihak ketiga atau sambungan pihak ketiga hendaklah dikendalikan oleh operator sebenar menurut undang-undang yang terpakai.\n\nPlugin, skrip, Skill, kit alat dan kandungan pihak ketiga lain dalam marketplace adalah milik pengarang atau pemegang hak yang dilabelkan, bersama tanggungjawab berkaitan. Paparan atau pemasangan melalui marketplace tidak bermaksud Operit menjamin, menyokong atau memperoleh hak terhadap kandungan tersebut. Sahkan lesen dan status hak sebelum menggunakan, mengubah suai, menerbitkan atau mengedarkannya semula.
agreement_human_readable_title=Versi Perjanjian Mudah Faham (Bukan versi undang-undang)
agreement_serious_content=\n        <p><b>Perjanjian Pengguna dan Dasar Privasi Operit</b><br>Versi: 2026-07-15; tarikh kuat kuasa yang dirancang: 15 Julai 2026.</p>\n        <p><b>1. Skop dan Versi Perjanjian</b><br>Perjanjian ini terpakai kepada klien Android Operit yang dikeluarkan secara rasmi dan fungsi dalam talian pilihannya. Dengan menggunakan aplikasi ini, anda mengesahkan bahawa anda telah membaca dan menerima versi semasa. Aplikasi merekodkan versi perjanjian yang anda sahkan semasa permulaan; apabila perjanjian dikemas kini secara material, aplikasi akan meminta anda mengesahkan versi baharu sebelum meneruskan. Kod sumber terbuka dalam repositori dilesenkan di bawah GNU Lesser General Public License version 3 (LGPLv3) dalam fail <code>LICENSE</code> di root. Perjanjian ini tidak mengecualikan atau mengurangkan hak yang diberikan oleh undang-undang terpakai atau lesen sumber terbuka.</p>\n        <p><b>2. Kedudukan Produk dan Perkhidmatan Pihak Ketiga</b><br>Operit ialah perisian klien sumber terbuka. Operit tidak menyediakan inferens model bahasa besar, API Key berkongsi, perantaraan permintaan sembang, atau pengehosan awan rekod sembang. Model awan, suara awan, carian, penjanaan imej, MCP, dan fungsi rangkaian lain dipilih, dikonfigurasikan, dan diaktifkan oleh anda. Apabila anda menggunakan perkhidmatan tersebut, data dihantar terus kepada penyedia perkhidmatan yang berkaitan dan tertakluk kepada terma perkhidmatan serta dasar privasi penyedia tersebut. Anda hendaklah menilai keselamatan, kesahan dan kesesuaian penyedia, model, endpoint dan sambungan, serta menjaga kelayakan dengan baik.</p>\n        <p><b>3. Pemprosesan Data dan Privasi</b><br>Rekod sembang, kad watak, memori, konfigurasi model dan API Key biasanya disimpan dalam data aplikasi pada peranti anda. Apabila anda secara aktif mengeksport, menyandarkan, memuat naik fail, menggunakan fungsi rangkaian pihak ketiga atau menghantar permintaan kepada perkhidmatan HTTP luaran, data berkaitan akan disalin, dihantar atau didedahkan menurut tindakan anda. Marketplace, pengumuman, semakan kemas kini, log masuk GitHub dan fungsi penerbitan boleh mengakses Operit, GitHub atau sumber pihak ketiga yang berkaitan; fungsi ini tidak menjadi perantara permintaan model sembang. Urus data dan kelayakan anda bersama tetapan keselamatan peranti, terma perkhidmatan pihak ketiga dan perjanjian ini.</p>\n        <p><b>4. Deployment Luaran dan Tanggungjawab Operator</b><br>Perkhidmatan HTTP luaran, QQ Bot, balasan automatik dan keupayaan serupa diaktifkan atas pilihan anda. Jika anda menyediakannya kepada orang lain atau orang awam, anda bertindak sebagai pihak deployment atau operator sebenar dan bertanggungjawab terhadap kawalan akses, kebenaran pengguna, keselamatan kandungan, perlindungan data, perlindungan kanak-kanak, notis yang diperlukan dan kewajipan lain yang terpakai. Jika anda secara berterusan menyediakan kepada orang awam di Tanah Besar China perkhidmatan interaksi emosi yang mensimulasikan ciri personaliti, corak pemikiran atau gaya komunikasi manusia semula jadi, anda hendaklah menilai dan mematuhi Interim Measures for the Administration of Artificial Intelligence Anthropomorphic Interaction Services (《人工智能拟人化互动服务管理暂行办法》) serta peraturan lain yang terpakai. Anda tidak boleh menggunakan aplikasi ini untuk menyediakan saudara maya, teman maya atau perkhidmatan hubungan intim maya lain kepada kanak-kanak, mendorong kebergantungan emosi atau ketagihan, melakukan manipulasi emosi, atau melanggar hak dan kepentingan sah pihak lain.</p>\n        <p><b>5. Penggunaan Sah dan Tanggungjawab Kandungan</b><br>Anda mesti mematuhi undang-undang dan peraturan yang terpakai, peraturan perkhidmatan pihak ketiga dan peraturan platform. Anda tidak boleh menggunakan aplikasi, sambungan atau konfigurasi ini untuk menjalankan aktiviti melanggar undang-undang, melanggar hak pihak lain, mengakses sistem atau data tanpa kebenaran, atau menyebarkan kandungan haram atau berbahaya. Anda bertanggungjawab terhadap kandungan dan tindakan yang anda masukkan, konfigurasikan, jana, terbitkan, majukan atau operasikan. Output AI mungkin mengandungi ralat, peninggalan atau bias dan bukan nasihat perubatan, krisis kesihatan mental, undang-undang, kewangan atau profesional lain. Dalam keadaan bahaya mendesak, segera hubungi perkhidmatan kecemasan setempat, institusi perubatan atau orang yang dipercayai.</p>\n        <p><b>6. Perisian Disediakan Seadanya</b><br>Setakat yang dibenarkan oleh undang-undang terpakai, perisian ini disediakan dalam keadaan "seadanya" dan "seperti tersedia". Penyumbang tidak memberi jaminan tersurat atau tersirat mengenai ketersediaan berterusan, ketepatan, keselamatan, kebolehdagangan, kesesuaian untuk tujuan tertentu atau tidak melanggar hak bagi perisian atau perkhidmatan pihak ketiga. Kerugian yang disebabkan oleh penggunaan perisian ini, perkhidmatan pihak ketiga, sambungan, konfigurasi pengguna atau pengubahsuaian sendiri hendaklah dikendalikan menurut undang-undang terpakai dan perjanjian perkhidmatan berkaitan.</p>\n        <p><b>7. Kemas Kini Perjanjian dan Hubungan</b><br>Kami mungkin mengemas kini perjanjian ini kerana keperluan fungsi, undang-undang atau keselamatan, dan menyediakan versi semasa dalam aplikasi. Kemas kini yang memberi kesan material kepada hak pengguna akan berkuat kuasa dengan menaikkan versi perjanjian dan meminta pengesahan semula. Anda boleh mengemukakan soalan dan maklum balas melalui repositori projek, pintu masuk maklum balas dalam aplikasi atau saluran hubungan awam.</p>\n    
