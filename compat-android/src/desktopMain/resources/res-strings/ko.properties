function_config_desc=채팅, 음성, 데스크톱 펫은 모두 여기에서 설정한 기능 모델과 프롬프트를 사용합니다.
function_config_title=기능 구성
function_desc_audio_recognition=오디오 콘텐츠 인식 및 분석에 사용됩니다. 오디오에 대해 read_file을 호출할 때 더 깊은 이해를 위해 intent(예: 전사, 요약, 화자별 내용)를 전달할 수 있습니다. 오디오 입력 또는 고품질 전사를 지원하는 모델 사용을 권장합니다.
function_desc_chat=사용자와의 일상적인 대화를 위한 기본 채팅 기능
function_desc_file_binding=파일 내용의 지능적인 바인딩 및 혼합을 처리하여 보다 정확한 코드 처리 기능을 제공합니다. Gemini Flash와 같은 빠르고 저렴한 모델 사용을 권장하며 DeepSeek R1 사용은 권장하지 않습니다.
function_desc_grep=grep_context 계획 및 결과 필터링에 사용됩니다(다중 grep_code).
function_desc_image_recognition=이미지 내용 인식 및 분석에 사용되며, 깊은 이해를 위해 read_file 도구 호출 시 intent 매개변수를 지원합니다. 비전 기능을 갖춘 다중 모드 모델을 사용하는 것이 좋습니다.
function_desc_memory=메모리를 처리하여 메모리 라이브러리에 저장합니다.
function_desc_role_response_planner=그룹 내 말하기 순서 및 건너뛰기 결정을 동적으로 계획하고 다단계 토론을 지원합니다.
function_desc_summary=컨텍스트 압축 및 채팅 요약 생성
function_desc_title_generation=사용자의 첫 메시지를 바탕으로 짧고 정확한 대화 제목을 생성합니다.
function_desc_translation=다국어 번역 기능을 제공하여 텍스트 콘텐츠의 언어 변환을 지원합니다. 다국어를 지원하는 모델을 사용하는 것이 좋습니다.
function_desc_ui_controller=UI 인터페이스의 자동 순회 및 작동에 사용됩니다. 해당 UI 컨트롤러 모델은 사용자가 제어를 위해 "에이전트"를 사용하도록 명시적으로 요청하는 경우에만 활성화됩니다(예: autoglm-phone-9b와 같은 전용 모델 선택).
function_desc_video_recognition=동영상 콘텐츠 인식 및 분석에 사용됩니다. 비디오에 대해 read_file을 호출할 때 더 깊은 이해를 위해 intent(예: 프레임 기반 이해, 장면 설명, 대화 요약)를 전달할 수 있습니다. 비디오/이미지 입력을 지원하는 다중 모드 모델을 사용하는 것이 좋습니다.
