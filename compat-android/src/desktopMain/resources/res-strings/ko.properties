default_assistant_guide_intro=Operit를 기본 시스템 도우미로 설정한 후 홈 버튼을 길게 누르거나 음성 깨우기를 사용하여 Operit 음성 도우미를 빠르게 시작할 수 있어 보다 편리한 AI 상호 작용 경험을 제공합니다.
