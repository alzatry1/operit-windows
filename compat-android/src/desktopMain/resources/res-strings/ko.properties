external_http_chat_intent_overview=HTTP와 Intent는 동일한 매개변수 의미를 공유합니다. 입력 방법만 다릅니다.\n\n요청 Action: %1$s\n기본 결과 Action: %2$s\n\n공통 extras: message, request_id, group, create_new_chat, chat_id, create_if_none, show_floating, return_tool_status, initial_mode, auto_exit_after_ms, stop_after, reply_action, reply_package\n\n완료 후 Operit는 success, chat_id, ai_response, error를 브로드캐스트로 반환합니다. 결과를 하나의 앱에만 전달해야 한다면 reply_package를 설정하세요.
