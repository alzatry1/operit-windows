import_structure_guide_content=이 내용은 앱 내부 저장소가 아니라 가져오기 패키지의 구조입니다(ZIP 안의 파일 또는 선택한 파일 기준).\n\nDragonBones(.zip)\n  my_dragonbones.zip\n    any_folder_name/\n      hero_ske.json\n      hero_tex.json\n      hero_tex.png\n  요구 사항: ske/tex json/png 파일은 같은 파일명 접두사를 사용해야 합니다.\n\nWebP(.zip)\n  my_webp.zip\n    any_folder_name/\n      idle.webp\n      talking.webp\n      happy.webp\n  요구 사항: .webp 파일을 하나 이상 포함해야 합니다.\n\nMP4\n  방식 A(직접 파일):\n    avatar.mp4\n  방식 B(.zip):\n    my_mp4.zip\n      any_folder_name/\n        idle.mp4\n        talking.mp4\n        happy.mp4\n  요구 사항: .mp4 파일을 하나 이상 포함해야 합니다.\n\nMMD(.zip)\n  my_mmd.zip\n    any_folder_name/\n      character.pmx(또는 .pmd)\n      motions/idle.vmd(선택 사항)\n      textures/...\n  요구 사항: PMX/PMD가 참조하는 상대 경로를 변경하지 않아야 합니다.\n\nglTF\n  방식 A(직접 파일):\n    avatar.glb\n  방식 B(여러 파일로 된 glTF는 .zip 사용):\n    my_gltf.zip\n      any_folder_name/\n        avatar.gltf\n        avatar.bin\n        textures/...\n  요구 사항: .gltf가 참조하는 상대 경로를 변경하지 않아야 합니다.\n\nFBX\n  방식 A(직접 파일, 자체 포함 리소스만):\n    avatar.fbx\n  방식 B(외부 텍스처/리소스는 .zip 사용):\n    my_fbx.zip\n      any_folder_name/\n        avatar.fbx\n        textures/...\n  요구 사항: .fbx 직접 업로드는 내장 리소스만 지원합니다. 모델이 외부 텍스처나 다른 리소스를 참조하는 경우 상대 경로를 유지한 채 모두 ZIP으로 묶어 주세요.
