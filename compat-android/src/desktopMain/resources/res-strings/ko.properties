default_assistant_guide_open_settings=설정 열기
default_assistant_guide_step1_desc=먼저 Android 시스템 설정 인터페이스로 들어가야 합니다.
default_assistant_guide_step1_detail1=• 시스템 설정 → 앱 → 기본 앱 → 디지털 보조 앱 열기
default_assistant_guide_step1_detail2=• 보조 앱 목록에서 "Operit AI"를 찾아 선택하세요.
default_assistant_guide_step1_detail_android12=Android 12+: 설정 → 앱 → 기본 앱 → 디지털 보조 앱 → 기본 디지털 보조 앱
default_assistant_guide_step1_title=시스템 설정 열기
default_assistant_guide_step2_desc=시스템 설정에서 음성 어시스턴트 또는 디지털 어시스턴트 관련 옵션을 찾으세요.
default_assistant_guide_step2_detail1=• 설정 위치는 휴대폰 제조업체마다 약간씩 다를 수 있습니다.
default_assistant_guide_step2_detail2=• 일반적으로 위치: 설정 → 앱 → 기본 앱 → 디지털 보조 앱
default_assistant_guide_step2_detail3=• 음성 깨우기: "Hey Google" 또는 기기에 지정된 깨우기 단어(기기 지원 필요)
default_assistant_guide_step2_detail_android12=Android 12+: 설정 → 앱 → 기본 앱 → 디지털 보조 앱 → 기본 디지털 보조 앱
default_assistant_guide_step2_note=참고: 제스처 설정은 휴대폰 브랜드에 따라 다를 수 있습니다. 시스템 설정에서 사용 가능한 옵션을 확인하세요.
default_assistant_guide_step2_title=어시스턴트 설정 찾기
default_assistant_guide_step3_desc=보조 앱 목록에서 Operit AI를 선택하세요.
default_assistant_guide_step3_detail1=• 사용 가능한 보조 앱 목록에서 "Operit AI"를 찾으세요.
default_assistant_guide_step3_detail2=• 탭하여 선택하면 시스템이 Operit를 기본 보조자로 설정합니다.
default_assistant_guide_step3_detail3=• 말하거나 입력하여 어시스턴트와 상호작용할 수 있습니다.
default_assistant_guide_step3_title=Operit 선택
default_assistant_guide_step4_desc=설정 후 정상적으로 실행되는지 테스트해 보세요.
default_assistant_guide_step4_detail1=• 홈 버튼(홈 화면 버튼)을 길게 누르면 Operit 음성 지원이 호출됩니다.
default_assistant_guide_step4_detail2=• 음성 깨우기가 지원되는 경우 "Hey Google" 또는 기기에 지정된 깨우기 단어를 말하면 Operit가 실행될 수도 있습니다.
