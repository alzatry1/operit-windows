agreement_disclaimer=쉬운 설명 버전은 이해를 돕기 위한 것입니다. 중국어 정식 버전과 다를 경우 중국어 정식 버전이 우선합니다.
agreement_human_readable_content=서비스 경계: Operit은 일반 대중을 대상으로 하는 의인화 정서 상호작용 서비스를 제공하지 않습니다. Operit은 사용자 기기에서 로컬로 실행되는 오픈소스 클라이언트입니다. 모델 추론 서비스를 운영하지 않고, 채팅 세션이나 상호작용 데이터를 호스팅하지 않으며, 공유 모델 자격 증명을 배포하지 않습니다. 클라우드 모델 요청은 사용자가 직접 구성한 자격 증명으로 기기에서 선택한 모델 제공업체로 바로 전송되며, 관련 데이터에는 해당 제공업체의 규칙이 적용됩니다. 로컬 모델은 기기 안에서 추론을 실행합니다.\n\n이 앱은 파일, 터미널, 자동화, Root, ADB, 확장 및 유사한 기능을 호출할 수 있습니다. 실행 전에 작업 내용을 확인하고, 중요한 데이터를 백업하며, 권한을 신중하게 부여하세요. 사용자 작업, 사용자 구성, 제3자 서비스 또는 제3자 확장으로 인해 기기, 데이터, 계정 또는 기타 이익에 손실이 발생한 경우 실제 작업자가 관련 법률에 따라 처리해야 합니다.\n\n마켓플레이스의 제3자 플러그인, 스크립트, Skill, 도구 패키지 및 기타 콘텐츠의 저작권과 관련 책임은 표시된 작성자 또는 권리자에게 있습니다. 마켓플레이스 표시 또는 설치가 Operit의 보증, 보증성 추천, 또는 해당 콘텐츠에 대한 권리 취득을 의미하지 않습니다. 사용, 수정, 게시 또는 재배포 전에 라이선스와 권리 상태를 직접 확인하세요.
agreement_human_readable_title=쉬운 설명 버전(법적 문서가 아님)
agreement_serious_content=\n        <p><b>Operit 사용자 계약 및 개인정보 처리방침</b><br>버전: 2026-07-15; 예정 효력 발생일: 2026년 7월 15일.</p>\n        <p><b>1. 적용 범위와 계약 버전</b><br>본 계약은 Operit이 공식 배포하는 Android 클라이언트 및 선택적 온라인 기능에 적용됩니다. 이 앱을 사용하면 현재 버전을 읽고 동의한 것으로 봅니다. 앱은 시작 시 사용자가 확인한 계약 버전을 기록하며, 계약에 실질적인 업데이트가 있는 경우 계속 사용하기 전에 새 버전을 다시 확인하도록 요구합니다. 저장소의 오픈소스 코드는 루트 <code>LICENSE</code> 파일에 명시된 GNU Lesser General Public License version 3 (LGPLv3)에 따라 라이선스됩니다. 본 계약은 관련 법률 및 오픈소스 라이선스가 부여하는 권리를 배제하거나 축소하지 않습니다.</p>\n        <p><b>2. 제품 위치와 제3자 서비스</b><br>Operit은 오픈소스 클라이언트 소프트웨어입니다. 대형 언어 모델 추론, 공유 API Key, 채팅 요청 중계 또는 채팅 기록 클라우드 호스팅을 제공하지 않습니다. 클라우드 모델, 클라우드 음성, 검색, 이미지 생성, MCP 및 기타 네트워크 기능은 사용자가 선택, 구성 및 활성화합니다. 해당 서비스를 사용할 때 데이터는 해당 서비스 제공업체로 직접 전송되며, 그 제공업체의 서비스 약관과 개인정보 처리방침이 적용됩니다. 사용자는 제공업체, 모델, 엔드포인트 및 확장의 안전성, 적법성 및 적합성을 직접 판단하고 관련 자격 증명을 안전하게 보관해야 합니다.</p>\n        <p><b>3. 데이터 처리와 개인정보</b><br>채팅 기록, 캐릭터 카드, 기억, 모델 구성 및 API Key는 일반적으로 기기의 앱 데이터에 저장됩니다. 사용자가 내보내기, 백업, 파일 업로드, 제3자 네트워크 기능 사용 또는 외부 HTTP 서비스로 요청 제출을 직접 수행하면 관련 데이터가 그 작업에 따라 복사, 전송 또는 공개됩니다. 마켓플레이스, 공지, 업데이트 확인, GitHub 로그인 및 게시 기능은 Operit, GitHub 또는 관련 제3자 리소스에 접근할 수 있으며, 이러한 기능은 채팅 모델 요청을 중계하지 않습니다. 기기 보안 설정, 제3자 서비스 약관 및 본 계약을 함께 고려하여 데이터와 자격 증명을 관리하세요.</p>\n        <p><b>4. 외부 배포와 운영 책임</b><br>외부 HTTP 서비스, QQ Bot, 자동 응답 및 유사 기능은 사용자의 선택으로 활성화됩니다. 이를 타인 또는 대중에게 제공하는 경우 사용자는 실제 배포자 또는 운영자로서 접근 제어, 사용자 승인, 콘텐츠 안전, 데이터 보호, 미성년자 보호, 필요한 안내 및 기타 적용 의무를 책임집니다. 중국 본토의 대중에게 자연인의 성격 특성, 사고 방식 또는 의사소통 스타일을 모방하는 정서 상호작용 서비스를 지속적으로 제공하는 경우, 사용자는 《人工智能拟人化互动服务管理暂行办法》 및 기타 적용 규정을 직접 평가하고 준수해야 합니다. 이 앱을 사용하여 미성년자에게 가상 친족, 가상 동반자 등 가상 친밀 관계 서비스를 제공하거나, 정서적 의존 또는 중독을 유도하거나, 감정 조작을 하거나, 타인의 합법적 권익을 침해해서는 안 됩니다.</p>\n        <p><b>5. 적법한 사용과 콘텐츠 책임</b><br>사용자는 적용 법령, 제3자 서비스 규칙 및 플랫폼 규칙을 준수해야 합니다. 이 앱, 확장 또는 구성을 이용하여 불법 활동, 타인 권리 침해, 시스템 또는 데이터에 대한 무단 접근, 불법 또는 유해 콘텐츠 유포를 해서는 안 됩니다. 사용자가 입력, 구성, 생성, 게시, 전달 또는 운영하는 콘텐츠와 행위에 대한 책임은 사용자에게 있습니다. AI 출력에는 오류, 누락 또는 편향이 있을 수 있으며 의료, 심리 위기, 법률, 금융 또는 기타 전문 조언이 아닙니다. 긴급한 위험 상황에서는 현지 응급 서비스, 의료기관 또는 신뢰할 수 있는 사람에게 즉시 연락하세요.</p>\n        <p><b>6. 소프트웨어의 현상 제공</b><br>관련 법률이 허용하는 범위에서 본 소프트웨어는 "있는 그대로" 및 "사용 가능한 상태"로 제공됩니다. 기여자는 소프트웨어 또는 제3자 서비스의 지속적 이용 가능성, 정확성, 안전성, 상품성, 특정 목적 적합성 또는 비침해에 대해 명시적 또는 묵시적 보증을 하지 않습니다. 본 소프트웨어, 제3자 서비스, 확장, 사용자 구성 또는 자체 수정 사용으로 인한 손실은 관련 법률 및 해당 서비스 계약에 따라 처리되어야 합니다.</p>\n        <p><b>7. 계약 업데이트와 연락</b><br>기능, 법률 또는 보안 요구에 따라 본 계약을 업데이트할 수 있으며 앱 안에서 현재 버전을 제공합니다. 사용자 권리에 실질적 영향을 미치는 업데이트는 계약 버전을 올리고 다시 확인을 요구하는 방식으로 효력이 발생합니다. 프로젝트 저장소, 앱 내 피드백 창구 또는 공개 연락 채널을 통해 질문과 의견을 제출할 수 있습니다.</p>\n    
