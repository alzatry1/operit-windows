default_assistant_guide_troubleshooting_content=목록에서 Operit을 찾을 수 없는 경우 다음을 확인하세요. \n\n• 앱이 제대로 설치되었으며 비활성화되지 않았는지 \n• 필요한 권한이 부여되었습니다(마이크, 오버레이 등)\n• 장치를 다시 시작하고 다시 설정해 보세요\n\n일부 맞춤 시스템 타사 앱이 기본 도우미로 설정되는 것을 제한할 수 있습니다. 이러한 상황이 발생하더라도 앱 내 플로팅 창 기능을 통해 Operit를 계속 사용할 수 있습니다.
