function_config_desc=El chat, la voz y la mascota de escritorio seleccionarán automáticamente la configuración de prompt correspondiente según el uso
function_config_title=Configuración de funciones
function_desc_audio_recognition=Se utiliza para el reconocimiento y análisis de contenido de audio. Al llamar a la herramienta read_file para leer audio, se puede usar el parámetro intent para una comprensión profunda (como transcripción/resumen/reconocimiento del contenido hablado). Se recomienda usar un modelo compatible con entrada de audio o transcripción de alta calidad.
function_desc_chat=Función principal de chat para interacción diaria de conversación con usuarios
function_desc_file_binding=Procesa la vinculación inteligente y mezcla de contenido de archivos, proporcionando capacidades de procesamiento de código más precisas. Se recomienda usar modelos rápidos y económicos como Gemini Flash, no se recomienda usar DeepSeek R1
function_desc_grep=Planificación de búsqueda y filtrado de resultados para grep_context (grep_code en múltiples rondas)
function_desc_image_recognition=Se utiliza para el reconocimiento y análisis de contenido de imágenes. Al llamar a la herramienta read_file para leer imágenes, se admite el parámetro intent para una comprensión profunda. Se recomienda usar un modelo multimodal compatible con visión.
function_desc_memory=Procesar recuerdos y almacenarlos en la biblioteca de memoria
function_desc_role_response_planner=Se utiliza para determinar dinámicamente el orden de intervención y la estrategia de salto en un grupo, compatible con múltiples rondas de discusión.
function_desc_summary=Comprimir el contexto y generar resúmenes de chat
function_desc_title_generation=Genera un título breve y preciso para la conversación a partir del primer mensaje del usuario.
function_desc_translation=Proporciona funciones de traducción multilingüe, admite la conversión de idioma del contenido de texto. Se recomienda usar un modelo que admita varios idiomas.
function_desc_ui_controller=Utilizado para la exploración y operación automáticas de interfaces de UI. El modelo de controlador de UI correspondiente solo se activará cuando el usuario solicite explícitamente usar un «agente» para el control, por ejemplo eligiendo modelos dedicados como autoglm-phone-9b.
function_desc_video_recognition=Se utiliza para el reconocimiento y análisis de contenido de video. Al llamar a la herramienta read_file para leer video, se puede usar el parámetro intent para una comprensión profunda (como extracción de fotogramas/descripción de escenas/resumen de diálogos). Se recomienda usar un modelo multimodal compatible con entrada de video/imagen.
