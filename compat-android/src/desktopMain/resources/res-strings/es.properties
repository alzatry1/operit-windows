import_structure_guide_content=Esta es la estructura de directorios del "paquete de importación" (ZIP o archivo seleccionado internamente), no el almacenamiento interno de la aplicación.\n\nDragonBones (.zip)\n  my_dragonbones.zip\n    any_folder_name/\n      hero_ske.json\n      hero_tex.json\n      hero_tex.png\n  Requisito: los nombres de archivo ske/tex json/png deben tener el mismo prefijo.\n\nWebP (.zip)\n  my_webp.zip\n    any_folder_name/\n      idle.webp\n      talking.webp\n      happy.webp\n  Requisito: al menos un archivo .webp.\n\nMP4\n  Método A (archivo directo):\n    avatar.mp4\n  Método B (.zip):\n    my_mp4.zip\n      any_folder_name/\n        idle.mp4\n        talking.mp4\n        happy.mp4\n  Requisito: al menos un archivo .mp4.\n\nMMD (.zip)\n  my_mmd.zip\n    any_folder_name/\n      character.pmx (o .pmd)\n      motions/idle.vmd (opcional)\n      textures/...\n  Requisito: mantener las rutas relativas referenciadas por PMX/PMD.\n\nglTF\n  Método A (archivo directo):\n    avatar.glb\n  Método B (glTF de múltiples archivos usando .zip):\n    my_gltf.zip\n      any_folder_name/\n        avatar.gltf\n        avatar.bin\n        textures/...\n  Requisito: mantener las rutas relativas referenciadas por .gltf.\n\nFBX\n  Método A (archivo directo, solo recursos autocontenidos):\n    avatar.fbx\n  Método B (texturas/recursos externos usar .zip):\n    my_fbx.zip\n      any_folder_name/\n        avatar.fbx\n        textures/...\n  Requisito: la carga directa de .fbx solo admite recursos incrustados; si el modelo referencia texturas externas u otros recursos, mantenga las rutas relativas y colóquelos en un ZIP.
