default_assistant_guide_step2_detail1=• Mantener presionado el botón de inicio: la forma más común, disponible en la mayoría de dispositivos
default_assistant_guide_step2_detail2=• Deslizar hacia arriba desde la parte inferior de la pantalla: en algunos dispositivos con gestos de pantalla completa
default_assistant_guide_step2_detail3=• Activación por voz: "Hey Google" o la palabra de activación especificada por el dispositivo (requiere compatibilidad del dispositivo)
default_assistant_guide_step2_detail_android12=Android 12+: Configuración → Aplicaciones → Aplicaciones predeterminadas → Aplicación de asistente digital → Aplicación de asistente digital predeterminada
default_assistant_guide_step2_note=Nota: los gestos pueden variar según la marca del teléfono. Consulte las opciones disponibles en la configuración del sistema.
default_assistant_guide_step2_title=Configurar gesto de activación
default_assistant_guide_step3_desc=Una vez configurado, compruebe si Operit se activa correctamente.
default_assistant_guide_step3_detail1=• Use el gesto configurado (como mantener presionado el botón de inicio) para activar el asistente.
default_assistant_guide_step3_detail2=• Si tiene éxito, debería ver la interfaz del asistente de voz de Operit.
default_assistant_guide_step3_detail3=• Puede intentar hablar o escribir texto para interactuar con el asistente.
default_assistant_guide_step3_title=Probar la función del asistente
default_assistant_guide_step4_desc=Una vez configurado, compruebe si se inicia correctamente.
default_assistant_guide_step4_detail1=• Mantener presionado el botón de inicio debería abrir el asistente de voz Operit.
default_assistant_guide_step4_detail2=• Si el dispositivo admite activación por voz, decir "Hey Google" o la palabra de activación especificada también puede activar Operit.
default_assistant_guide_step4_title=Probar el asistente de voz
default_assistant_guide_steps_title=Pasos de configuración
default_assistant_guide_subtitle=Haz de Operit tu asistente inteligente
default_assistant_guide_title=Configurar asistente de voz predeterminado
default_assistant_guide_troubleshooting_content=Si no encuentra Operit en la lista, asegúrese de que:\n\n• La aplicación esté instalada correctamente y no esté deshabilitada.\n• Se hayan concedido los permisos necesarios (micrófono, ventana flotante, etc.).\n• Intente reiniciar el dispositivo y configurarlo de nuevo.\n\nAlgunos sistemas personalizados pueden restringir aplicaciones de terceros como asistente predeterminado. En ese caso, aún puede usar Operit mediante la función de ventana flotante dentro de la aplicación.
