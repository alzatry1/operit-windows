token_info_content=Será redirigido al sitio web oficial de la API de DeepSeek. Incorporamos el acceso al sitio oficial de DeepSeek porque consideramos que es la API más rentable para uso doméstico, no solo por su potente rendimiento, sino también por sus diversos descuentos y caché en disco que reducen los costos de uso.\n\nEl acceso a la API y la configuración del Token no están relacionados con el desarrollador del software. No proporcionaremos ningún servicio al respecto ni cobraremos ninguna tarifa.\n\nPara la primera vez que use su propio token, se recomienda recargar solo 1 yuan, que es más que suficiente.
