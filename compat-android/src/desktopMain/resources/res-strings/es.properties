market_agreement_content=1. Posicionamiento del mercado. El mercado de complementos de Operit se utiliza únicamente para compartir, descubrir e indexar scripts, kits de herramientas, Skills, MCP y otras extensiones, y proporciona acceso de navegación, descarga e instalación dentro del mercado. El mercado no es autor, comprador, vendedor, intermediario, cobrador, garante ni registro de derechos; que el mercado muestre, incluya, clasifique o recomiende un complemento no implica que Operit lo haya desarrollado, sea propietario, lo represente o lo respalde.\n\n2. Autorización de publicación. Al enviar un complemento al mercado, el publicador otorga a Operit una licencia no exclusiva, no transferible y necesaria únicamente para operar el mercado, para guardar, almacenar en caché, copiar, procesar, mostrar, indexar entradas del mercado y proporcionar a los usuarios del mercado la descarga e instalación de dicho complemento. La publicación también indica que el publicador permite a los usuarios del mercado descargar, instalar y usar el complemento dentro del ámbito de su diseño, pero no autoriza automáticamente la modificación o redistribución. Esta licencia no transfiere los derechos de autor, propiedad u otros derechos del complemento; el mercado no puede obtener una sublicencia libre fuera del mercado. El publicador debe asegurarse de tener derecho a otorgar dicha autorización.\n\n3. Recomendación de código abierto en GitHub. Recomendamos que los publicadores publiquen directamente el código fuente, README, licencia, versiones o releases y registro de cambios en un repositorio público de GitHub bajo su control, y registren la fuente en el mercado desde ese repositorio. Que un repositorio de GitHub sea visible públicamente no equivale a otorgar automáticamente una licencia de código abierto; si se permite el uso, modificación y redistribución depende de la licencia de código abierto declarada explícitamente por el autor u otra autorización escrita.\n\n4. Uso y redistribución por parte del usuario. El derecho de redistribución de un complemento queda, en principio, reservado al autor u otros titulares de derechos. La descarga, instalación y uso normal mencionados no equivalen a otorgar a cada usuario el derecho de volver a subir, reenviar, modificar el paquete, vender o republicar el complemento. Salvo disposición legal en contrario, los usuarios solo pueden modificar y redistribuir según la licencia o autorización declarada por el autor; los complementos que no declaren permiso de redistribución no pueden redistribuirse por cuenta propia. El alcance de los derechos de los complementos de código abierto se rige por su licencia de código abierto.\n\n5. Riesgo de terceros y responsabilidad de seguridad. Los complementos tienen código, configuración y permisos de ejecución independientes; pueden ejecutar código, iniciar servicios locales, acceder a archivos, leer variables de entorno o conectarse a la red. Los usuarios deben revisar por sí mismos y asumir los riesgos de habilitar, instalar y usar complementos. Los publicadores no deben incluir API Keys, cookies, tokens, claves privadas, contraseñas de cuentas o datos de usuario en complementos, repositorios, ejemplos o configuraciones, y deben declarar con precisión autor, licencia, permisos, comportamiento de red, variables de entorno, servicios externos y riesgos conocidos. Operit no garantiza la seguridad, precisión, disponibilidad, legalidad o compatibilidad de extensiones de terceros.\n\n6. Comentarios y comportamiento comunitario. Los comentarios deben estar relacionados con la funcionalidad del complemento, la experiencia de uso, defectos o problemas de seguridad. No se permite publicar números de grupo de QQ, Telegram, Discord, información de contacto, publicidad, contenido de desvío, información de transacciones, enlaces no relacionados u otro contenido que pueda alterar el orden de la comunidad; no se permite publicar API Keys, cookies, tokens, claves privadas, contraseñas de cuentas u otros datos personales.\n\n7. Prohibición de transacciones y desvío. No se permite comprar, vender, revender o instalar complementos en el mercado, ni inducir a otros a pagar por complementos gratuitos mediante cobros, donaciones, membresías, chats privados o enlaces de terceros. El mercado no ofrece servicios de pago, cumplimiento, reembolso o resolución de disputas de transacciones. Los complementos gratuitos no requieren pago a nadie; los cobros, autorizaciones o promesas de canales de terceros no representan el respaldo oficial de Operit.\n\n8. Límites del servicio del mercado. Para proporcionar servicios de intercambio, descarga e instalación, el mercado puede guardar, almacenar en caché o transmitir entradas del mercado y archivos de complementos, pero no promete alojamiento permanente, copias de seguridad, confidencialidad o prevención de copias. Publicar en el mercado implica que el autor autoriza al mercado a proporcionar descarga e instalación a los usuarios del mercado según este acuerdo, pero no implica que el público obtenga automáticamente derechos de redistribución. La accesibilidad, descarga y disponibilidad continua del complemento también dependen del repositorio del autor, GitHub y otros servicios de terceros.\n\n9. Ejecución de normas y actualización del acuerdo. Los comentarios, entradas o cuentas que violen estas normas pueden ser restringidos, ocultados o eliminados. Cuando el acuerdo del mercado sufra cambios sustanciales por razones funcionales, legales o de seguridad, se aumentará la versión del acuerdo; los usuarios deberán volver a leerlo y confirmarlo al entrar nuevamente al mercado.
