agreement_disclaimer=La versión en lenguaje simple solo facilita la comprensión. Si difiere de la versión formal china, prevalece la versión formal china.
agreement_human_readable_content=Límite del servicio: Operit no proporciona servicios públicos de interacción emocional antropomórfica. Operit es un cliente de código abierto que se ejecuta localmente en el dispositivo del usuario. No opera servicios de inferencia de modelos, no aloja sesiones de chat ni datos de interacción, y no distribuye credenciales de modelo compartidas. Las solicitudes a modelos en la nube se envían directamente desde su dispositivo al proveedor de modelos que configure con sus propias credenciales; los datos relacionados se rigen por las reglas de ese proveedor. Los modelos locales infieren en su dispositivo.\n\nEsta aplicación puede llamar archivos, terminales, automatización, Root, ADB, extensiones y capacidades similares. Revise las operaciones antes de ejecutarlas, haga copias de seguridad de los datos importantes y otorgue permisos con cuidado. Las pérdidas relacionadas con dispositivos, datos, cuentas u otros intereses causadas por acciones del usuario, configuración del usuario, servicios de terceros o extensiones de terceros deben ser gestionadas por el operador real según la ley aplicable.\n\nLos plugins, scripts, Skills, kits de herramientas y otros contenidos de terceros del mercado pertenecen a sus autores o titulares de derechos indicados, junto con la responsabilidad correspondiente. La publicación o instalación desde el mercado no significa que Operit garantice, respalde u obtenga derechos sobre ese contenido. Confirme la licencia y el estado de los derechos antes de usarlo, modificarlo, publicarlo o redistribuirlo.
agreement_human_readable_title=Acuerdo en lenguaje simple (versión no legal)
agreement_serious_content=\n        <p><b>Acuerdo de usuario y política de privacidad de Operit</b><br>Versión: 2026-07-15; fecha efectiva prevista: 15 de julio de 2026.</p>\n        <p><b>1. Alcance y versión del acuerdo</b><br>Este acuerdo se aplica al cliente Android publicado oficialmente por Operit y a sus funciones en línea opcionales. Al usar esta aplicación, confirma que ha leído y aceptado la versión actual. La aplicación registra al iniciar la versión del acuerdo que usted ha aceptado; cuando el acuerdo tenga una actualización sustancial, la aplicación le pedirá confirmar la nueva versión antes de continuar. El código abierto del repositorio se licencia bajo la Licencia Pública General Menor de GNU versión 3 (LGPLv3) indicada en el archivo raíz <code>LICENSE</code>. Este acuerdo no excluye ni reduce los derechos otorgados por la ley aplicable o por licencias de código abierto.</p>\n        <p><b>2. Posición del producto y servicios de terceros</b><br>Operit es software cliente de código abierto. No proporciona inferencia de modelos de lenguaje grandes, API Keys compartidas, retransmisión de solicitudes de chat ni alojamiento en la nube de historiales de chat. Los modelos en la nube, voz en la nube, búsqueda, generación de imágenes, MCP y otras funciones de red son elegidos, configurados y habilitados por usted. Cuando usa esos servicios, los datos se envían directamente al proveedor correspondiente y se rigen por sus términos de servicio y política de privacidad. Usted debe evaluar la seguridad, legalidad e idoneidad de proveedores, modelos, endpoints y extensiones, y proteger sus credenciales.</p>\n        <p><b>3. Tratamiento de datos y privacidad</b><br>Los historiales de chat, tarjetas de personaje, memorias, configuración de modelos y API Keys normalmente se almacenan en los datos de la aplicación en su dispositivo. Cuando exporta, hace copias de seguridad, carga archivos, usa funciones de red de terceros o envía solicitudes a un servicio HTTP externo, los datos relacionados se copiarán, transmitirán o divulgarán según sus acciones. El mercado, anuncios, comprobaciones de actualización, inicio de sesión de GitHub y funciones de publicación pueden acceder a recursos de Operit, GitHub o terceros relacionados; estas funciones no retransmiten solicitudes de modelos de chat. Gestione sus datos y credenciales junto con la configuración de seguridad del dispositivo, los términos de terceros y este acuerdo.</p>\n        <p><b>4. Despliegue externo y responsabilidad del operador</b><br>Los servicios HTTP externos, QQ Bot, respuestas automáticas y capacidades similares se habilitan a su elección. Si los pone a disposición de otras personas o del público, actúa como desplegador u operador real y es responsable del control de acceso, autorización de usuarios, seguridad del contenido, protección de datos, protección de menores, avisos necesarios y otras obligaciones aplicables. Si proporciona de forma continua al público en China continental servicios de interacción emocional que simulan rasgos de personalidad, patrones de pensamiento o estilos de comunicación de personas naturales, debe evaluar y cumplir las Medidas provisionales para la administración de servicios de interacción antropomórfica de inteligencia artificial (《人工智能拟人化互动服务管理暂行办法》) y otras normas aplicables. No debe usar esta aplicación para ofrecer a menores familiares virtuales, compañeros virtuales u otros servicios de relación íntima virtual, inducir dependencia emocional o adicción, realizar manipulación emocional ni infringir de otro modo derechos e intereses legítimos de terceros.</p>\n        <p><b>5. Uso legal y responsabilidad por el contenido</b><br>Debe cumplir las leyes y regulaciones aplicables, las reglas de servicios de terceros y las reglas de plataforma. No debe usar esta aplicación, extensiones o configuración para realizar actividades ilegales, infringir derechos de terceros, acceder sin autorización a sistemas o datos, o difundir contenido ilegal o dañino. Usted es responsable del contenido y la conducta que introduzca, configure, genere, publique, reenvíe u opere. Las salidas de IA pueden contener errores, omisiones o sesgos y no constituyen asesoramiento médico, de crisis de salud mental, legal, financiero ni otro asesoramiento profesional. En situaciones urgentes de peligro, contacte de inmediato con los servicios de emergencia locales, instituciones médicas o personas de confianza.</p>\n        <p><b>6. Software proporcionado tal como está</b><br>En la medida permitida por la ley aplicable, este software se proporciona "tal como está" y "según disponibilidad". Los contribuyentes no ofrecen garantías expresas o implícitas sobre la disponibilidad continua, exactitud, seguridad, comerciabilidad, idoneidad para un propósito particular o no infracción del software o de servicios de terceros. Las pérdidas causadas por el uso de este software, servicios de terceros, extensiones, configuración del usuario o modificaciones propias deben gestionarse conforme a la ley aplicable y los acuerdos de servicio correspondientes.</p>\n        <p><b>7. Actualizaciones del acuerdo y contacto</b><br>Podemos actualizar este acuerdo por requisitos funcionales, legales o de seguridad, y proporcionar la versión actual dentro de la aplicación. Las actualizaciones que afecten sustancialmente los derechos de los usuarios entrarán en vigor aumentando la versión del acuerdo y solicitando confirmación nuevamente. Puede enviar preguntas y comentarios mediante el repositorio del proyecto, la entrada de comentarios de la aplicación o canales públicos de contacto.</p>\n    
