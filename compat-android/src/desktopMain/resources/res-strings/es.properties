enable_background_keep_alive=Mantener vivo en segundo plano
enable_background_keep_alive_description=Al activarlo, se conserva la notificación en primer plano y el servicio en primer plano no se cierra automáticamente cuando la IA entra en estado inactivo. Ideal para escenarios que requieren una permanencia prolongada en segundo plano.
enable_claude_1h_prompt_cache=Habilitar caché de prompts de Claude de 1 hora
enable_claude_1h_prompt_cache_desc=Al activarlo, Claude y proveedores compatibles con Claude usarán un TTL de caché de prompts de 1 hora
enable_codex_web_search=Habilitar búsqueda web de Codex
enable_codex_web_search_desc=Después de iniciar sesión en Codex, permite que el modelo utilice la búsqueda web del servidor.
enable_custom_font=Habilitar fuente personalizada
enable_deepseek_reasoning=Habilitar modo de razonamiento DeepSeek
enable_deepseek_reasoning_desc=Cuando está habilitado, el contenido dentro de la etiqueta <think> se enviará como reasoning_content al modelo DeepSeek, para admitir la llamada a herramientas en modelos de razonamiento como DeepSeek-R1
enable_deepseek_web_search=Habilitar búsqueda web de DeepSeek
enable_deepseek_web_search_desc=Al usar el endpoint de DeepSeek Responses, permite que el modelo utilice la búsqueda web del servidor.
enable_direct_audio_processing=El modelo admite análisis de audio
enable_direct_audio_processing_desc=Al activarlo, el audio se enviará directamente a la IA para su procesamiento, en lugar de devolver una transcripción/descripción de texto mediante una herramienta
enable_direct_image_processing=El modelo admite reconocimiento de imágenes
enable_direct_image_processing_desc=Al activarlo, las imágenes se enviarán directamente a la IA para su procesamiento, en lugar de que la IA las lea mediante una herramienta OCR
enable_direct_video_processing=El modelo admite análisis de video
enable_direct_video_processing_desc=Al activarlo, el video se enviará directamente a la IA para su procesamiento, en lugar de extraer fotogramas/analizar mediante una herramienta
enable_emoticons=Activar emoticonos
enable_enter_to_send=Enviar con Enter
enable_enter_to_send_description=Al activarlo, al presionar Enter en el campo de entrada del chat se enviará directamente, y la tecla de envío del teclado también se mostrará como enviar.
enable_floating_mode=Habilitar modo de ventana flotante
