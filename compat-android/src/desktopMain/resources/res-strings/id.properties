import_structure_guide_content=Ini adalah struktur direktori "paket impor" (ZIP atau di dalam file yang dipilih), bukan penyimpanan internal aplikasi.\n\nDragonBones (.zip)\n  my_dragonbones.zip\n    any_folder_name/\n      hero_ske.json\n      hero_tex.json\n      hero_tex.png\n  Persyaratan: awalan nama file ske/tex json/png harus sama.\n\nWebP (.zip)\n  my_webp.zip\n    any_folder_name/\n      idle.webp\n      talking.webp\n      happy.webp\n  Persyaratan: setidaknya berisi satu file .webp.\n\nMP4\n  Metode A (file langsung):\n    avatar.mp4\n  Metode B (.zip):\n    my_mp4.zip\n      any_folder_name/\n        idle.mp4\n        talking.mp4\n        happy.mp4\n  Persyaratan: setidaknya berisi satu file .mp4.\n\nMMD (.zip)\n  my_mmd.zip\n    any_folder_name/\n      character.pmx (atau .pmd)\n      motions/idle.vmd (opsional)\n      textures/...\n  Persyaratan: pertahankan jalur relatif yang dirujuk oleh PMX/PMD.\n\nglTF\n  Metode A (file langsung):\n    avatar.glb\n  Metode B (glTF multi-file gunakan .zip):\n    my_gltf.zip\n      any_folder_name/\n        avatar.gltf\n        avatar.bin\n        textures/...\n  Persyaratan: pertahankan jalur relatif yang dirujuk oleh .gltf.\n\nFBX\n  Metode A (file langsung, hanya untuk aset yang mandiri):\n    avatar.fbx\n  Metode B (untuk tekstur/aset eksternal gunakan .zip):\n    my_fbx.zip\n      any_folder_name/\n        avatar.fbx\n        textures/...\n  Persyaratan: unggah langsung .fbx hanya mendukung aset tertanam; jika model merujuk tekstur eksternal atau aset lain, pertahankan jalur relatif dan masukkan ke ZIP.
