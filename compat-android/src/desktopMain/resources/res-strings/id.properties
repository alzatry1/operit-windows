agreement_human_readable_content=Batas layanan: Operit tidak menyediakan layanan interaksi emosional antropomorfik untuk publik. Operit adalah klien sumber terbuka yang berjalan secara lokal di perangkat pengguna. Operit tidak mengoperasikan layanan inferensi model, tidak menghosting sesi chat atau data interaksi, dan tidak membagikan kredensial model bersama. Permintaan model cloud dikirim langsung dari perangkat Anda ke penyedia model yang Anda konfigurasi dengan kredensial Anda sendiri; data terkait tunduk pada aturan penyedia tersebut. Model lokal melakukan inferensi di perangkat Anda.\n\nAplikasi ini dapat memanggil file, terminal, otomatisasi, Root, ADB, ekstensi, dan kemampuan serupa. Periksa operasi sebelum menjalankannya, cadangkan data penting, dan berikan izin dengan hati-hati. Kerugian atas perangkat, data, akun, atau kepentingan lain yang disebabkan oleh tindakan pengguna, konfigurasi pengguna, layanan pihak ketiga, atau ekstensi pihak ketiga harus ditangani oleh operator sebenarnya menurut hukum yang berlaku.\n\nPlugin, skrip, Skill, toolkit, dan konten pihak ketiga lain di marketplace adalah milik penulis atau pemegang hak yang tercantum, beserta tanggung jawab terkait. Penayangan atau pemasangan dari marketplace tidak berarti Operit menjamin, mendukung, atau memperoleh hak atas konten tersebut. Pastikan lisensi dan status hak sebelum menggunakan, memodifikasi, menerbitkan, atau mendistribusikannya kembali.
agreement_human_readable_title=Versi Perjanjian Mudah Dipahami (Bukan Versi Hukum)
agreement_serious_content=\n        <p><b>Perjanjian Pengguna dan Kebijakan Privasi Operit</b><br>Versi: 2026-07-15; tanggal berlaku yang direncanakan: 15 Juli 2026.</p>\n        <p><b>1. Ruang Lingkup dan Versi Perjanjian</b><br>Perjanjian ini berlaku untuk klien Android Operit yang dirilis secara resmi dan fitur online opsionalnya. Dengan menggunakan aplikasi ini, Anda menyatakan telah membaca dan menyetujui versi saat ini. Aplikasi mencatat versi perjanjian yang Anda setujui saat startup; ketika perjanjian diperbarui secara substansial, aplikasi akan meminta Anda mengonfirmasi versi baru sebelum melanjutkan. Kode sumber terbuka di repositori dilisensikan berdasarkan GNU Lesser General Public License version 3 (LGPLv3) dalam file <code>LICENSE</code> di root. Perjanjian ini tidak mengecualikan atau mengurangi hak yang diberikan oleh hukum yang berlaku atau lisensi sumber terbuka.</p>\n        <p><b>2. Posisi Produk dan Layanan Pihak Ketiga</b><br>Operit adalah perangkat lunak klien sumber terbuka. Operit tidak menyediakan inferensi model bahasa besar, API Key bersama, relay permintaan chat, atau hosting cloud untuk riwayat chat. Model cloud, suara cloud, pencarian, pembuatan gambar, MCP, dan fitur jaringan lain dipilih, dikonfigurasi, dan diaktifkan oleh Anda. Saat Anda menggunakan layanan tersebut, data dikirim langsung ke penyedia layanan terkait dan tunduk pada ketentuan layanan serta kebijakan privasi penyedia tersebut. Anda harus menilai keamanan, legalitas, dan kesesuaian penyedia, model, endpoint, dan ekstensi, serta menjaga kredensial dengan baik.</p>\n        <p><b>3. Pemrosesan Data dan Privasi</b><br>Riwayat chat, kartu karakter, memori, konfigurasi model, dan API Key biasanya disimpan dalam data aplikasi di perangkat Anda. Saat Anda secara aktif mengekspor, mencadangkan, mengunggah file, menggunakan fitur jaringan pihak ketiga, atau mengirim permintaan ke layanan HTTP eksternal, data terkait akan disalin, dikirim, atau diungkap sesuai tindakan Anda. Marketplace, pengumuman, pemeriksaan pembaruan, login GitHub, dan fitur publikasi dapat mengakses Operit, GitHub, atau sumber daya pihak ketiga terkait; fitur ini tidak merelay permintaan model chat. Kelola data dan kredensial Anda bersama pengaturan keamanan perangkat, ketentuan layanan pihak ketiga, dan perjanjian ini.</p>\n        <p><b>4. Deployment Eksternal dan Tanggung Jawab Operator</b><br>Layanan HTTP eksternal, QQ Bot, balasan otomatis, dan kemampuan serupa diaktifkan atas pilihan Anda. Jika Anda menyediakannya untuk orang lain atau publik, Anda bertindak sebagai pihak yang benar-benar melakukan deployment atau operator dan bertanggung jawab atas kontrol akses, otorisasi pengguna, keamanan konten, perlindungan data, perlindungan anak di bawah umur, pemberitahuan yang diperlukan, dan kewajiban lain yang berlaku. Jika Anda secara berkelanjutan menyediakan kepada publik di Tiongkok daratan layanan interaksi emosional yang mensimulasikan sifat kepribadian, pola berpikir, atau gaya komunikasi manusia alami, Anda harus menilai dan mematuhi Interim Measures for the Administration of Artificial Intelligence Anthropomorphic Interaction Services (《人工智能拟人化互动服务管理暂行办法》) serta aturan lain yang berlaku. Anda tidak boleh menggunakan aplikasi ini untuk menyediakan kerabat virtual, pendamping virtual, atau layanan hubungan intim virtual lain kepada anak di bawah umur, mendorong ketergantungan emosional atau kecanduan, melakukan manipulasi emosional, atau melanggar hak dan kepentingan sah pihak lain.</p>\n        <p><b>5. Penggunaan yang Sah dan Tanggung Jawab Konten</b><br>Anda harus mematuhi hukum dan peraturan yang berlaku, aturan layanan pihak ketiga, dan aturan platform. Anda tidak boleh menggunakan aplikasi, ekstensi, atau konfigurasi ini untuk melakukan kegiatan melanggar hukum, melanggar hak pihak lain, mengakses sistem atau data tanpa izin, atau menyebarkan konten ilegal atau berbahaya. Anda bertanggung jawab atas konten dan tindakan yang Anda masukkan, konfigurasi, hasilkan, publikasikan, teruskan, atau operasikan. Keluaran AI dapat mengandung kesalahan, kelalaian, atau bias dan bukan nasihat medis, krisis kesehatan mental, hukum, keuangan, atau profesional lainnya. Dalam keadaan bahaya mendesak, segera hubungi layanan darurat setempat, institusi medis, atau orang tepercaya.</p>\n        <p><b>6. Perangkat Lunak Disediakan Apa Adanya</b><br>Sejauh diizinkan oleh hukum yang berlaku, perangkat lunak ini disediakan dalam kondisi "apa adanya" dan "sebagaimana tersedia". Kontributor tidak memberikan jaminan tersurat atau tersirat atas ketersediaan berkelanjutan, akurasi, keamanan, kelayakan jual, kesesuaian untuk tujuan tertentu, atau tidak adanya pelanggaran dari perangkat lunak maupun layanan pihak ketiga. Kerugian yang disebabkan oleh penggunaan perangkat lunak ini, layanan pihak ketiga, ekstensi, konfigurasi pengguna, atau modifikasi sendiri harus ditangani menurut hukum yang berlaku dan perjanjian layanan terkait.</p>\n        <p><b>7. Pembaruan Perjanjian dan Kontak</b><br>Kami dapat memperbarui perjanjian ini karena kebutuhan fitur, hukum, atau keamanan, dan menyediakan versi saat ini di dalam aplikasi. Pembaruan yang berdampak substansial pada hak pengguna akan berlaku dengan menaikkan versi perjanjian dan meminta konfirmasi ulang. Anda dapat menyampaikan pertanyaan dan masukan melalui repositori proyek, pintu masuk umpan balik dalam aplikasi, atau kanal kontak publik.</p>\n    
