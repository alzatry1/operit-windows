function_config_desc=Obrolan, suara, dan desktop pet akan secara otomatis memilih konfigurasi prompt yang sesuai berdasarkan penggunaan
function_config_title=Konfigurasi fungsi
function_desc_audio_recognition=Digunakan untuk pengenalan dan analisis konten audio, dapat menggunakan parameter intent untuk pemahaman mendalam (seperti transkripsi/ringkasan/pengenalan konten pembicaraan) saat memanggil alat read_file untuk membaca audio. Disarankan menggunakan model yang mendukung input audio atau transkripsi berkualitas tinggi.
function_desc_chat=Fungsi percakapan utama, digunakan untuk interaksi percakapan sehari-hari dengan pengguna
function_desc_file_binding=Memproses pengikatan dan pencampuran konten file secara cerdas, menyediakan kemampuan pemrosesan kode yang lebih presisi. Disarankan menggunakan model cepat dan murah seperti Gemini Flash, tidak disarankan menggunakan DeepSeek R1
function_desc_grep=Digunakan untuk perencanaan pencarian dan penyaringan hasil grep_context (grep_code multi-ronde)
function_desc_image_recognition=Digunakan untuk pengenalan dan analisis konten gambar, mendukung parameter intent untuk pemahaman mendalam saat memanggil alat read_file untuk membaca gambar. Disarankan menggunakan model multimodal yang mendukung visi.
function_desc_memory=Memproses memori dan menyimpannya ke dalam bank memori
function_desc_role_response_planner=Digunakan untuk menentukan urutan giliran bicara dan strategi skip secara dinamis dalam grup, mendukung diskusi multi-ronde
function_desc_summary=Kompresi konteks, menghasilkan ringkasan obrolan
function_desc_title_generation=Membuat judul percakapan yang singkat dan akurat dari pesan pertama pengguna.
function_desc_translation=Menyediakan fungsi terjemahan multibahasa, mendukung konversi bahasa untuk konten teks. Disarankan menggunakan model yang mendukung multibahasa.
function_desc_ui_controller=Digunakan untuk navigasi dan operasi otomatis antarmuka UI, model pengontrol UI terkait hanya akan diaktifkan ketika pengguna secara eksplisit meminta penggunaan kontrol "Agen", misalnya dapat memilih model khusus seperti autoglm.
function_desc_video_recognition=Digunakan untuk pengenalan dan analisis konten video, dapat menggunakan parameter intent untuk pemahaman mendalam (seperti pemahaman ekstraksi frame/deskripsi adegan/ringkasan percakapan) saat memanggil alat read_file untuk membaca video. Disarankan menggunakan model multimodal yang mendukung input video/gambar.
