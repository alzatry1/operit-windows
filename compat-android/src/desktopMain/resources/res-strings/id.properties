default_assistant_guide_intro=Setelah mengatur Operit sebagai asisten default sistem, Anda dapat meluncurkan asisten suara Operit dengan cepat dengan menekan lama tombol Home atau menggunakan pemicu suara, untuk mendapatkan pengalaman interaksi AI yang lebih nyaman.
default_assistant_guide_open_gesture_settings=Buka pengaturan gestur
default_assistant_guide_open_settings=Buka pengaturan asisten
default_assistant_guide_step1_desc=Atur Operit sebagai aplikasi asisten digital default sistem
default_assistant_guide_step1_detail1=• Buka Pengaturan sistem → Aplikasi → Aplikasi default → Aplikasi asisten digital
default_assistant_guide_step1_detail2=• Temukan dan pilih "Operit AI" dalam daftar aplikasi asisten
default_assistant_guide_step1_detail_android12=Android 12+: Pengaturan → Aplikasi → Aplikasi default → Aplikasi asisten digital → Aplikasi asisten digital default
default_assistant_guide_step1_title=Atur sebagai Asisten Default
default_assistant_guide_step2_desc=Atur cara memanggil asisten Operit dengan cepat
default_assistant_guide_step2_detail1=• Tekan lama tombol Home: Cara paling umum, tersedia di sebagian besar perangkat
default_assistant_guide_step2_detail2=• Geser ke atas dari bagian bawah layar: Untuk beberapa perangkat yang mendukung gestur layar penuh
default_assistant_guide_step2_detail3=• Pemicu suara: "Hey Google" atau kata pemicu yang ditentukan perangkat (jika didukung perangkat)
default_assistant_guide_step2_detail_android12=Android 12+: Pengaturan → Aplikasi → Aplikasi default → Aplikasi asisten digital → Aplikasi asisten digital default
default_assistant_guide_step2_note=Catatan: Pengaturan gestur dapat berbeda di ponsel merek yang berbeda, periksa opsi yang tersedia di pengaturan sistem
default_assistant_guide_step2_title=Konfigurasi Gestur Peluncuran
default_assistant_guide_step3_desc=Setelah pengaturan selesai, uji apakah Operit dapat dipanggil dengan normal
default_assistant_guide_step3_detail1=• Gunakan gestur yang Anda atur (seperti menekan lama tombol Home) untuk memanggil asisten
default_assistant_guide_step3_detail2=• Jika berhasil, Anda akan melihat antarmuka asisten suara Operit
default_assistant_guide_step3_detail3=• Anda dapat mencoba berbicara atau mengetik teks untuk berinteraksi dengan asisten
default_assistant_guide_step3_title=Uji Fungsi Asisten
default_assistant_guide_step4_desc=Setelah pengaturan selesai, uji apakah dapat diluncurkan dengan normal
default_assistant_guide_step4_detail1=• Menekan lama tombol Home (tombol layar utama) seharusnya memunculkan asisten suara Operit
default_assistant_guide_step4_detail2=• Jika perangkat mendukung pemicu suara, mengucapkan "Hey Google" atau kata pemicu yang ditentukan perangkat juga dapat memicu Operit
default_assistant_guide_step4_title=Uji Asisten Suara
default_assistant_guide_steps_title=Langkah Pengaturan
default_assistant_guide_subtitle=Jadikan Operit sebagai asisten pintar Anda
default_assistant_guide_title=Atur Asisten Suara Default
default_assistant_guide_troubleshooting_content=Jika tidak dapat menemukan Operit dalam daftar, pastikan:\n\n• Aplikasi telah diinstal dengan benar dan tidak dinonaktifkan\n• Izin yang diperlukan telah diberikan (mikrofon, jendela mengambang, dll.)\n• Coba restart perangkat dan atur ulang\n\nBeberapa sistem kustom mungkin membatasi aplikasi pihak ketiga sebagai asisten default. Jika mengalami hal ini, Anda masih dapat menggunakan Operit melalui fungsi jendela mengambang dalam aplikasi.
