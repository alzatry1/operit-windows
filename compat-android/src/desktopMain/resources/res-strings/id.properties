token_info_content=Anda akan diarahkan ke situs resmi DeepSeek API. Kami menyertakan akses ke situs resmi DeepSeek karena kami menganggapnya sebagai API dengan harga terbaik untuk penggunaan di dalam negeri, tidak hanya performanya kuat, tetapi juga memiliki berbagai diskon dan cache disk untuk mengurangi biaya penggunaan.\n\nAkses API dan pengaturan Token tidak ada hubungannya dengan pengembang perangkat lunak, kami tidak menyediakan layanan apa pun dalam hal ini, dan tidak akan mengambil keuntungan apa pun.\n\nSaat pertama kali menggunakan token sendiri, disarankan hanya mengisi 1 yuan, sudah cukup untuk digunakan.
