default_assistant_guide_step1_detail1=• Open System Settings → Apps → Default apps → Digital assistant app
default_assistant_guide_step1_detail2=• Find and select "Operit AI" in the assistant app list
default_assistant_guide_step1_detail_android12=Android 12+: Settings → Apps → Default apps → Digital assistant app → Default digital assistant app
default_assistant_guide_step1_title=Open System Settings
default_assistant_guide_step2_desc=In system settings, find voice assistant or digital assistant related options
default_assistant_guide_step2_detail1=• The settings location may vary slightly between different phone manufacturers
default_assistant_guide_step2_detail2=• Usually located at: Settings → Apps → Default apps → Digital assistant app
default_assistant_guide_step2_detail3=• Voice wake-up: "Hey Google" or your device's designated wake word (device support required)
default_assistant_guide_step2_detail_android12=Android 12+: Settings → Apps → Default apps → Digital assistant app → Default digital assistant app
default_assistant_guide_step2_note=Note: Gesture settings may vary between phone brands. Please check available options in system settings
default_assistant_guide_step2_title=Find Assistant Settings
default_assistant_guide_step3_desc=Choose Operit AI from the assistant app list
default_assistant_guide_step3_detail1=• Find "Operit AI" in the available assistant apps list
default_assistant_guide_step3_detail2=• Tap to select, and the system will set Operit as the default assistant
default_assistant_guide_step3_detail3=• You can try speaking or typing to interact with the assistant
default_assistant_guide_step3_title=Select Operit
default_assistant_guide_step4_desc=After setup, test if it can be launched normally
default_assistant_guide_step4_detail1=• Long-press the Home button (home screen button) should invoke Operit voice assistant
default_assistant_guide_step4_detail2=• If voice wake-up is supported, saying "Hey Google" or your device's designated wake word may also trigger Operit
default_assistant_guide_step4_title=Test Voice Assistant
default_assistant_guide_steps_title=Setup Steps
default_assistant_guide_subtitle=Make Operit Your Smart Assistant
default_assistant_guide_title=Set Default Voice Assistant
default_assistant_guide_troubleshooting_content=If you can't find Operit in the list, please ensure:\n\n• The app is properly installed and not disabled\n• Necessary permissions have been granted (microphone, overlay, etc.)\n• Try restarting the device and setting it up again\n\nSome custom systems may restrict third-party apps from being set as default assistants. If you encounter this situation, you can still use Operit through the in-app floating window feature.
default_assistant_guide_troubleshooting_title=Having Problems?
