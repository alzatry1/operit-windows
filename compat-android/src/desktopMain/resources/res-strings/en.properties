function_desc_audio_recognition=Used for audio content recognition and analysis. When calling read_file for audio, you can pass an intent for deeper understanding (e.g., transcription, summarization, speaker content). Recommend using models that support audio input or high-quality transcription.
function_desc_chat=Main chat function for daily conversation interaction with users
function_desc_file_binding=Process intelligent binding and mixing of file content, providing more precise code processing capabilities. Recommend using fast, inexpensive models like Gemini Flash, not recommended to use DeepSeek R1
function_desc_grep=Used for grep_context planning and result filtering (multi-round grep_code)
function_desc_image_recognition=Used for image content recognition and analysis, supports intent parameter when calling read_file tool for deep understanding. Recommend using multimodal models with vision capabilities.
function_desc_memory=Process memories and store them in the memory library
function_desc_role_response_planner=Dynamically plans speaking order and skip decisions in groups, supports multi-turn discussions
function_desc_summary=Compress context and generate chat summaries
function_desc_title_generation=Generates a short, accurate conversation title from the first user message.
function_desc_translation=Provides multi-language translation functionality, supporting language conversion of text content. It is recommended to use models that support multiple languages.
function_desc_ui_controller=Used for automatic traversal and operation of UI interfaces. The corresponding UI controller model is only activated when the user explicitly requests to use an "agent" for control, for example by choosing dedicated models such as autoglm-phone-9b.
function_desc_video_recognition=Used for video content recognition and analysis. When calling read_file for video, you can pass an intent for deeper understanding (e.g., frame-based understanding, scene description, dialogue summary). Recommend using multimodal models that support video/image input.
