agreement_human_readable_content=Descrierea limitelor serviciului:Operit Nu se oferă servicii de interacțiune emoțională antropomorfă destinate publicului larg.Operit Este un client open-source care rulează local pe dispozitivul utilizatorului; nu operează servicii de inferență a modelelor, nu găzduiește sesiuni de chat sau date de interacțiune și nu distribuie utilizatorilor datele de autentificare ale modelelor partajate. Solicitările către modelele din cloud sunt trimise direct de pe dispozitiv către furnizorul de modele selectat, utilizând datele de autentificare configurate de utilizator, iar datele relevante sunt supuse regulilor respectivului furnizor; modelele locale efectuează inferența în interiorul dispozitivului.\n\nAceastă aplicație poate accesa fișiere, terminalul, funcțiile de automatizare,Root,ADB și capacități precum extensiile. Vă rugăm să verificați conținutul înainte de a efectua operațiunile, să faceți o copie de rezervă a datelor importante și să acordați permisiunile cu prudență; orice pierderi legate de dispozitiv, date, conturi sau de altă natură, cauzate de acțiunile utilizatorului, configurația utilizatorului, serviciile terțe sau extensiile terțe, vor fi gestionate de către persoana care a efectuat operațiunea, în conformitate cu legislația aplicabilă.\n\nPlugin-uri, scripturi și alte elemente de la terți disponibile pe piața de plugin-uri,Skill, kiturile de instrumente și alte conținuturi, ale căror drepturi de autor și responsabilități aferente aparțin autorilor sau titularilor de drepturi menționați. Prezentarea sau instalarea pe piață nu implică Operit Nu oferim nicio garanție, aviz de conformitate sau drepturi asupra acestui conținut. Vă rugăm să verificați personal statutul licenței și al drepturilor înainte de utilizare, modificare, publicare sau redistribuire.
agreement_human_readable_title=Versiunea simplificată a acordului (nu este versiunea juridică)
agreement_serious_content=\n        <p><b>Operit Termenii și condițiile de utilizare și politica de confidențialitate</b><br>Versiune:2026-07-15; Data prevăzută pentru intrarea în vigoare:2026 an 7 Luna 15 Zi.</p>\n        <p><b>1. Domeniul de aplicare și versiunea acordului</b><br>Prezentul acord se aplică Operit Publicat oficial Android Aplicația și funcțiile sale opționale online. Utilizarea acestei aplicații înseamnă că ați citit și ați acceptat versiunea actuală. La lansare, aplicația înregistrează versiunea acordului pe care ați confirmat-o; în cazul unor actualizări substanțiale ale acordului, aplicația vă va solicita să confirmați din nou înainte de a putea continua utilizarea. Licența codului sursă deschis din depozit se găsește în directorul rădăcină <code>LICENSE</code> prezentat GNU Licența publică generală largă, ediția a treia (LGPLv3); prezentul acord nu exclude și nu limitează drepturile care vă sunt conferite de legislația aplicabilă și de licențele open source.</p>\n        <p><b>2. Poziționarea produsului și serviciile terțe</b><br>Operit Este un software client open-source, care nu oferă funcții de inferență sau partajare pentru modelele lingvistice de mari dimensiuni API Key, redirecționarea cererilor de chat sau stocarea în cloud a istoricului conversațiilor. Modelul cloud, funcțiile vocale în cloud, căutarea, desenarea,MCP Alte funcții de rețea pot fi selectate, configurate și activate la alegerea dumneavoastră. Atunci când utilizați aceste servicii, datele vor fi transmise direct furnizorului de servicii respectiv și vor fi supuse termenilor și condițiilor de utilizare, precum și politicii de confidențialitate ale acestuia. Este responsabilitatea dumneavoastră să evaluați securitatea, legalitatea și adecvarea furnizorului de servicii, a modelului, a punctelor de acces și a extensiilor, precum și să păstrați în siguranță datele de autentificare corespunzătoare.</p>\n        <p><b>3. Prelucrarea datelor și confidențialitatea</b><br>Istoric de conversații, fișe de personaj, amintiri, configurații de modele și API Key De obicei, acestea sunt stocate în datele aplicației de pe dispozitiv. Puteți exporta, face copii de rezervă, încărca fișiere, utiliza funcții de rețea ale unor terți sau transmite către surse externe HTTP Atunci când trimiteți o solicitare de serviciu, datele relevante vor fi copiate, transmise sau divulgate în funcție de acțiunile dumneavoastră. Piață, anunțuri, verificarea actualizărilor,GitHub Funcțiile de autentificare și publicare vor accesa Operit,GitHub sau resurse terțe relevante; aceste funcții nu transmit cererile către modelul de chat. Vă rugăm să vă gestionați datele și datele de autentificare ținând cont de setările de securitate ale dispozitivului, de termenii și condițiile serviciilor terțe și de prezentul acord.</p>\n        <p><b>4. Responsabilități privind desfășurarea și operarea în străinătate</b><br>Extern HTTP Servicii,QQ Bot, răspunsurile automate și funcțiile similare pot fi activate la alegerea dumneavoastră. Atunci când le puneți la dispoziția altor persoane sau a publicului larg, trebuie să vă asumați, în calitate de operator sau administrator efectiv, responsabilitatea pentru controlul accesului, autorizarea utilizatorilor, securitatea conținutului, protecția datelor, protecția minorilor, afișarea avertismentelor necesare și îndeplinirea celorlalte obligații aplicabile. Atunci când furnizați în mod continuu publicului din China servicii de interacțiune emoțională care simulează trăsăturile de personalitate, modurile de gândire sau stilurile de comunicare ale persoanelor fizice, trebuie să evaluați în mod independent și să respectați „Măsurile provizorii privind gestionarea serviciilor de interacțiune antropomorfă bazate pe inteligența artificială” și alte reglementări aplicabile. Nu aveți dreptul să utilizați această aplicație pentru a furniza servicii de relații intime virtuale destinate minorilor, cum ar fi rude virtuale sau parteneri virtuali; nu aveți dreptul să induceți dependență emoțională sau adicție, să practicați manipularea emoțională sau să vă angajați în alte activități care încalcă drepturile și interesele legitime ale altor persoane.</p>\n        <p><b>5. Utilizarea legală și responsabilitatea privind conținutul</b><br>Trebuie să respectați legislația și reglementările aplicabile, regulile serviciilor terțe și regulile platformei; nu aveți dreptul să utilizați această aplicație, extensiile sau configurațiile pentru a desfășura activități ilegale, a încălca drepturile și interesele altor persoane, a accesa fără autorizație sistemele sau datele, sau a difuza conținut ilegal sau dăunător. Sunteți responsabil pentru conținutul și comportamentul pe care le introduceți, configurați, generați, publicați, redistribuiți sau gestionați.AI Informațiile prezentate pot conține erori, omisiuni sau inexactități și nu constituie sfaturi medicale, de gestionare a crizelor psihologice, juridice, financiare sau de altă natură profesională; în situații de urgență sau pericol, vă rugăm să contactați imediat serviciile locale de urgență, instituțiile medicale sau o persoană de încredere.</p>\n        <p><b>6. Software-ul este furnizat „așa cum este”</b><br>În măsura permisă de legislația aplicabilă, acest software este furnizat „așa cum este” și „așa cum este disponibil”. Contribuitorii nu oferă nicio garanție, expresă sau implicită, cu privire la disponibilitatea continuă, acuratețea, securitatea, caracterul comercializabil, adecvarea pentru un scop anume sau lipsa încălcării drepturilor de autor ale software-ului sau ale serviciilor terțe. Pierderile rezultate din utilizarea acestui software, a serviciilor terțe, a extensiilor, a configurărilor utilizatorului sau a modificărilor efectuate de utilizator vor fi tratate în conformitate cu legislația aplicabilă și cu acordurile de servicii corespunzătoare.</p>\n        <p><b>7. Actualizări ale acordului și date de contact</b><br>Este posibil să actualizăm prezentul acord din motive funcționale, legale sau de securitate, iar versiunea actuală va fi disponibilă în cadrul aplicației. Actualizările care au un impact substanțial asupra drepturilor utilizatorilor vor intra în vigoare prin majorarea versiunii acordului și prin solicitarea unei reconfirmări. Puteți trimite întrebări și sugestii prin intermediul depozitului de proiect, al secțiunii de feedback din aplicație sau al canalelor publice de contact.</p>\n    
