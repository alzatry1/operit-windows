market_agreement_content=1. Poziționarea pieței. Piața de pluginuri Operit este folosită doar pentru partajarea, descoperirea și indexarea scripturilor, kit-urilor de instrumente, Skill, MCP și altor extensii, oferind puncte de acces pentru navigare, descărcare și instalare în piață. Piața nu este autorul, cumpărătorul, vânzătorul, brokerul, colectorul de plăți, garantul sau instituția de înregistrare a drepturilor; afișarea, includerea, sortarea sau recomandarea unui plugin nu înseamnă că pluginul este dezvoltat, deținut, agent sau susținut de Operit.\n\n2. Autorizația de publicare. Prin trimiterea unui plugin în piață, editorul acordă Operit o licență neexclusivă, netransferabilă, necesară doar pentru operarea pieței, pentru a salva, stoca în cache, copia, procesa, afișa, indexa intrările din piață și pentru a oferi utilizatorilor pieței descărcarea și instalarea pluginului. Publicarea implică, de asemenea, că editorul permite utilizatorilor pieței să descarce, să instaleze și să utilizeze pluginul în scopurile sale proiectate, dar nu acordă automat permisiunea de modificare sau redistribuire. Această licență nu transferă drepturile de autor, proprietatea sau alte drepturi asupra pluginului; piața nu poate obține astfel o sublicență liberă în afara pieței. Editorul trebuie să se asigure că are dreptul de a acorda autorizația menționată.\n\n3. Recomandare open-source GitHub. Recomandăm editorilor să publice direct codul sursă, README, licența, versiunile sau Release-urile și jurnalele de modificări în depozite GitHub publice pe care le controlează și să înregistreze sursa din aceste depozite în piață. Vizibilitatea publică a unui depozit GitHub nu echivalează cu acordarea automată a unei licențe open-source; dacă utilizarea, modificarea și redistribuirea sunt permise depinde de licența open-source declarată explicit de autor sau de altă autorizație scrisă.\n\n4. Utilizarea și redistribuirea de către utilizatori. Dreptul de redistribuire a pluginurilor este, în principiu, rezervat autorului sau altor deținători de drepturi. Permisiunea de descărcare, instalare și utilizare normală menționată mai sus nu echivalează cu acordarea fiecărui utilizator a dreptului de a reîncărca, redirecționa, modifica pachetul, vinde sau republica pluginul. Cu excepția cazurilor prevăzute de lege, utilizatorii pot modifica și redistribui doar conform licenței sau autorizației declarate de autor; pluginurile care nu declară permisiunea de redistribuire nu pot fi redistribuite de sine stătător. Domeniul de aplicare al drepturilor pentru pluginurile open-source este conform licenței lor open-source.\n\n5. Riscuri terțe și responsabilitate pentru securitate. Pluginurile au cod, configurare și permisiuni de rulare independente; pot executa cod, porni servicii locale, accesa fișiere, citi variabile de mediu sau conecta la rețea. Utilizatorii ar trebui să revizuiască și să își asume riscurile activării, instalării și utilizării pluginurilor. Editorii nu trebuie să includă chei API, cookie-uri, token-uri, chei private, parole de cont sau date ale utilizatorilor în pluginuri, depozite, exemple sau configurații și trebuie să declare cu exactitate autorul, licența, permisiunile, comportamentul de rețea, variabilele de mediu, serviciile externe și riscurile cunoscute. Operit nu garantează securitatea, acuratețea, disponibilitatea, legalitatea sau compatibilitatea extensiilor terțe.\n\n6. Comentarii și comportamentul comunității. Comentariile ar trebui să fie legate de funcționalitatea pluginului, experiența de utilizare, defecte sau probleme de securitate. Nu este permisă publicarea de numere de grup QQ, Telegram, Discord etc., informații de contact, reclame, conținut de direcționare, informații de tranzacționare, linkuri irelevante sau alt conținut care poate perturba ordinea comunității; nu este permisă publicarea de chei API, cookie-uri, token-uri, chei private, parole de cont sau alte date personale.\n\n7. Interzicerea tranzacțiilor și a direcționării. Nu este permisă vânzarea, revânzarea sau instalarea la cerere a pluginurilor în piață; nu este permisă inducerea altora să plătească pentru pluginuri gratuite prin plăți, donații, abonamente, mesaje private sau linkuri terțe. Piața nu oferă servicii de plată, onorare, rambursare sau soluționare a disputelor de tranzacție. Pluginurile gratuite nu necesită plată către nimeni; taxele, autorizațiile sau promisiunile din canale terțe nu reprezintă aprobarea oficială Operit.\n\n8. Limitele serviciului pieței. Pentru a oferi servicii de partajare, descărcare și instalare, piața poate salva, stoca în cache sau transmite intrările din piață și fișierele pluginurilor, dar nu promite găzduire permanentă, backup, confidențialitate sau prevenirea copierii. Publicarea în piață înseamnă că autorul autorizează piața să ofere descărcarea și instalarea utilizatorilor pieței conform acestui acord, dar nu înseamnă că publicul obține automat dreptul de redistribuire. Accesibilitatea, descărcarea și disponibilitatea continuă a pluginurilor depind, de asemenea, de depozitul autorului, GitHub și alte servicii terțe.\n\n9. Executarea regulilor și actualizarea acordului. Comentariile, intrările sau conturile care încalcă acest cod pot fi restricționate, ascunse sau eliminate. Dacă acordul pieței suferă modificări substanțiale din motive funcționale, legale sau de securitate, versiunea acordului va fi actualizată; utilizatorii vor trebui să recitească și să confirme acordul la următoarea intrare în piață.
