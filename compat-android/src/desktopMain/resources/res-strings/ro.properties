import_structure_guide_content=Aceasta este structura de directoare a „pachetului de import” (ZIP sau în interiorul fișierului selectat), nu în memoria internă a aplicației.\n\nDragonBones(.zip)\n  my_dragonbones.zip\n    any_folder_name/\n      hero_ske.json\n      hero_tex.json\n      hero_tex.png\n  Cerințe:ske/tex json/png Prefixele numelor fișierelor sunt identice.\n\nWebP(.zip)\n  my_webp.zip\n    any_folder_name/\n      idle.webp\n      talking.webp\n      happy.webp\n  Cerințe: să conțină cel puțin unul .webp Fișier.\n\nMP4\n  Modalitate A(fișier direct):\n    avatar.mp4\n  Modalitate B(.zip):\n    my_mp4.zip\n      any_folder_name/\n        idle.mp4\n        talking.mp4\n        happy.mp4\n  Cerințe: să conțină cel puțin unul .mp4 Fișier.\n\nMMD(.zip)\n  my_mmd.zip\n    any_folder_name/\n      character.pmx(sau .pmd)\n      motions/idle.vmd(opțional)\n      textures/...\n  Cerință: menținerea PMX/PMD Căile relative citate rămân neschimbate.\n\nglTF\n  Modalitate A(fișier direct):\n    avatar.glb\n  Modalitate B(Mai multe fișiere glTF Utilizare .zip):\n    my_gltf.zip\n      any_folder_name/\n        avatar.gltf\n        avatar.bin\n        textures/...\n  Cerință: menținerea .gltf Căile relative citate rămân neschimbate.\n\nFBX\n  Modalitate A(Fișiere directe, numai resurse autonome):\n    avatar.fbx\n  Modalitate B(Textură externă/Vă rugăm să utilizați resursele .zip):\n    my_fbx.zip\n      any_folder_name/\n        avatar.fbx\n        textures/...\n  Cerințe: încărcare directă .fbx Se acceptă doar resursele încorporate; dacă modelul face referire la texturi externe sau la alte resurse, vă rugăm să păstrați căile relative și să le plasați în ZIP.
