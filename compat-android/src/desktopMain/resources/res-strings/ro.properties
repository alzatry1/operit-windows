function_config_title=Configurația funcțiilor
function_desc_audio_recognition=Utilizat pentru recunoașterea și analiza conținutului audio, apelread_fileInstrumentul poate fi utilizat atunci când se citește un fișier audiointentÎnțelegerea aprofundată a parametrilor (de exemplu, transcrierea/Concluzii/(Recunoașterea conținutului vorbirii). Se recomandă utilizarea unui model care acceptă intrare audio sau care oferă transcriere de înaltă calitate.
function_desc_chat=Funcția principală de dialog, utilizată pentru interacțiunile zilnice cu utilizatorii
function_desc_file_binding=Combinarea și integrarea inteligentă a conținutului documentelor, oferind o capacitate mai precisă de procesare a codului. Se recomandă utilizarea unor modele rapide și ieftine, cum ar fiGemini Flash, nu se recomandă utilizareaDeepSeek R1
function_desc_grep=utilizat pentrugrep_contextPlanificarea căutării și filtrarea rezultatelor (în mai multe etape)grep_code)
function_desc_image_recognition=Utilizat pentru recunoașterea și analiza conținutului imaginilor, apelareread_fileInstrumentul acceptă citirea imaginilorintentÎnțelegerea aprofundată a parametrilor. Se recomandă utilizarea unor modele multimodale care integrează informații vizuale.
function_desc_memory=Prelucrarea datelor din memorie și stocarea acestora în baza de date
function_desc_role_response_planner=Se utilizează pentru a stabili în mod dinamic, în cadrul unui grup, ordinea de intervenție și strategia de omitere pentru runda curentă, fiind compatibil cu discuțiile pe mai multe runde
function_desc_summary=Comprimă contextul și generează un rezumat al conversației
function_desc_title_generation=Generarea automată a unui titlu scurt și precis pentru conversație, pe baza primului mesaj al utilizatorului
function_desc_translation=Oferă funcții de traducere multilingvă, permițând conversia limbii conținutului text. Se recomandă utilizarea unui model care acceptă mai multe limbi.
function_desc_ui_controller=utilizat pentruUIParcurgerea și operațiunile automate ale interfeței, corespunzătoare UI Modelul de controlor este activat numai atunci când utilizatorul solicită în mod explicit utilizarea controlului de tip „agent inteligent”, de exemplu, opțional autoglm și alte modele specializate.
function_desc_video_recognition=Utilizat pentru recunoașterea și analiza conținutului video, apelareread_filePoate fi utilizat atunci când instrumentul citește un fișier videointentÎnțelegerea aprofundată a parametrilor (de exemplu, înțelegerea prin extragerea cadrelor)/Descrierea scenei/Rezumatul discuției). Se recomandă utilizarea unui videoclip/Model multimodal de introducere a imaginilor.
