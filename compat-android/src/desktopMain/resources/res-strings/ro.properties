waifu_mode=WaifuModul
waifu_mode_description=După activare,AIRăspunsurile vor fi trimise frază cu frază, separate prin semne de punctuație, pentru a crea o experiență de conversație mai naturală.
waifu_mode_explanation=• Mod normal:AITrimitere simultană a tuturor răspunsurilor\n• WaifuMod:AIRăspunsurile sunt împărțite pe propoziții, fiecare propoziție fiind afișată într-un balon separat\n• Întârziere inteligentă: calculează durata întârzierii în funcție de lungimea propoziției\n• Trimitere combinată: atunci când utilizatorul trimite mesaje scurte în mod consecutiv, după o pauză, acestea sunt combinate într-un singur mesaj care este transmis cătreAI\n• Curățare automată: eliminarea etichetelor de stare, afișarea doar a textului simplu\n• Funcții opționale: trimitere în bloc, eliminare semne de punctuație de la sfârșitul propoziției, editare Waifu Cuvinte-cheie, activare emoji\n• Situații de aplicare: simularea unui ritm de conversație mai natural\n• Atenție: este posibil ca acest mod să nu se adapteze foarte bine la apelurile către instrumente
